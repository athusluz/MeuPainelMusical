<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Kraken V6 (Ultra Low CPU)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            /* Transição de fundo reduzida para aliviar a CPU */
            transition: background-image 0.5s ease-in-out;
        }

        /* --- OTIMIZAÇÃO CRÍTICA: FUNDOS ESTÁTICOS SEM ANIMAÇÃO --- */
        .aurora-bg {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        }

        .dark-bg {
            background-color: #050505;
            background-image: none;
        }

        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); 
            z-index: 2;
            transition: background 1s ease;
        }

        #glass-overlay.fire-tint { background: rgba(180, 20, 50, 0.4) !important; }
        #glass-overlay.ice-tint { background: rgba(0, 100, 150, 0.4) !important; }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
        }

        #weather-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 8px 26px; 
            font-size: 30px; 
            font-weight: 800;
            color: #fff;
            display: none; 
            align-items: center;
            justify-content: center;
            gap: 12px; 
            margin-bottom: 20px; 
        }

        .dashboard-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            width: 100%;
            margin-bottom: 25px;
        }

        .hw-side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 5;
            width: 110px;
        }

        .hw-big-icon {
            font-size: 42px; 
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .hw-bar-value {
            font-size: 24px; 
            font-weight: 800;
            color: #fff;
            font-variant-numeric: tabular-nums; 
            display: flex;
            align-items: baseline;
            justify-content: center;
        }
        
        .hw-bar-unit {
            font-size: 14px; 
            font-weight: 600;
            color: #ddd;
            margin-left: 2px;
        }

        .hw-bar-label {
            font-size: 20px; 
            font-weight: 900;
            color: #c2e9fb;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-top: 5px;
        }

        .cover-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5; 
            position: relative;
            width: 340px;
            height: 340px;
            justify-content: center;
        }

        #center-visual-container {
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cover-circle { 
            width: 256px; 
            height: 256px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8); 
            object-fit: cover;
            display: block;
        }

        .bars-container {
            width: 256px;
            height: 256px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* OTIMIZAÇÃO: Animação removida. As barras são apenas decorativas estáticas agora */
        .bar {
            width: 12px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 6px;
        }
        .bar:nth-child(1) { height: 40px; }
        .bar:nth-child(2) { height: 80px; }
        .bar:nth-child(3) { height: 120px; }
        .bar:nth-child(4) { height: 60px; }
        .bar:nth-child(5) { height: 90px; }

        .title { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            letter-spacing: 1px;
            padding: 0 15px;
        }

        .title.news-mode {
            white-space: normal;
            font-size: 26px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .artist { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }

        .artist.news-mode { font-size: 18px; color: #ccc; }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }

        /* Transitions nos SVGs removidas para evitar recálculo de sub-pixel na CPU */
    </style>
</head>
<body>

    <div id="bg-layer" class="aurora-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        
        <div id="weather-box"></div>

        <div class="dashboard-container">
            <div class="hw-side-panel">
                <div class="hw-big-icon" id="cpu-icon">⚡</div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <div class="hw-bar-value"><span id="cpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                    <div class="hw-bar-value" style="font-size: 18px; color: #ccc;"><span id="cpu-l">--</span><span class="hw-bar-unit">%</span></div>
                </div>
                <div class="hw-bar-label">CPU</div>
            </div>
            
            <div class="cover-wrapper">
                <svg width="340" height="340" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none;">
                    <path d="M 170,332 A 162,162 0 0,1 170,8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                    <path d="M 170,318 A 148,148 0 0,1 170,22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 170,332 A 162,162 0 0,0 170,8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                    <path d="M 170,318 A 148,148 0 0,0 170,22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
                    
                    <g id="music-ring-container" style="display: none;">
                        <path d="M 170,306 A 136,136 0 0,1 170,34" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 170,306 A 136,136 0 0,0 170,34" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                        <path id="music-progress-left" d="M 170,306 A 136,136 0 0,1 170,34" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="427" stroke-dashoffset="427" stroke-linecap="round"/>
                        <path id="music-progress-right" d="M 170,306 A 136,136 0 0,0 170,34" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="427" stroke-dashoffset="427" stroke-linecap="round"/>
                    </g>

                    <path id="cpu-bar-fill" d="M 170,332 A 162,162 0 0,1 170,8" fill="none" stroke="transparent" stroke-width="8" stroke-linecap="round" stroke-dasharray="509" stroke-dashoffset="509"/>
                    <path id="cpu-load-fill" d="M 170,318 A 148,148 0 0,1 170,22" fill="none" stroke="transparent" stroke-width="6" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465"/>
                    <path id="gpu-bar-fill" d="M 170,332 A 162,162 0 0,0 170,8" fill="none" stroke="transparent" stroke-width="8" stroke-linecap="round" stroke-dasharray="509" stroke-dashoffset="509"/>
                    <path id="gpu-load-fill" d="M 170,318 A 148,148 0 0,0 170,22" fill="none" stroke="transparent" stroke-width="6" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465"/>
                </svg>

                <div id="center-visual-container">
                    <div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
                </div>
            </div>
            
            <div class="hw-side-panel">
                <div class="hw-big-icon" id="gpu-icon">⚡</div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <div class="hw-bar-value"><span id="gpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                    <div class="hw-bar-value" style="font-size: 18px; color: #ccc;"><span id="gpu-l">--</span><span class="hw-bar-unit">%</span></div>
                </div>
                <div class="hw-bar-label">GPU</div>
            </div>
        </div>

        <div id="info-title" class="title">Inicializando Sistema...</div>
        <div id="info-artist" class="artist"></div>
        <div id="info-album" class="album"></div>
    </div>

    <script>
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 

        const RSS_FEEDS = {
            'g1': { url: 'https://g1.globo.com/rss/g1/', name: 'G1' },
            'esports': { url: 'https://ge.globo.com/rss/esports/', name: 'e-Sports' },
            'tecnologia': { url: 'https://g1.globo.com/rss/g1/tecnologia/', name: 'Tecnologia' }
        };

        let activeSources = Object.keys(RSS_FEEDS);
        let currentTrackUrl = ''; let currentStatus = ''; 
        let newsInterval = null; let newsList = []; let currentNewsIndex = 0; 
        let goianiaWeather = null; let lastNewsFetchTime = 0;
        let cpuTemp = '--'; let cpuLoad = '--'; let gpuTemp = '--'; let gpuLoad = '--';

        const elBgLayer = document.getElementById('bg-layer');
        const elWidget = document.getElementById('music-widget');
        const elWeatherBox = document.getElementById('weather-box');
        const elCenterVisual = document.getElementById('center-visual-container');
        const elTitle = document.getElementById('info-title');
        const elArtist = document.getElementById('info-artist');
        const elAlbum = document.getElementById('info-album');
        const elGlass = document.getElementById('glass-overlay');

        const fallbackBarsHTML = `<div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;

        let pTracker = { active: false, posSec: 0, durSec: 0 };
        let wnpConnected = false;
        let wnpState = { state: 0, title: '', artist: '', album: '', coverUrl: '', positionSec: 0, durationSec: 0 };
        
        function connectWNP() {
            let ws = new WebSocket('ws://127.0.0.1:8999');
            ws.onopen = () => wnpConnected = true;
            ws.onclose = () => { wnpConnected = false; setTimeout(connectWNP, 10000); };
            ws.onmessage = (e) => {
                const d = e.data;
                if (d.startsWith('STATE:')) wnpState.state = parseInt(d.substring(6));
                else if (d.startsWith('TITLE:')) wnpState.title = d.substring(6);
                else if (d.startsWith('ARTIST:')) wnpState.artist = d.substring(7);
                else if (d.startsWith('COVER:')) wnpState.coverUrl = d.substring(6);
                else if (d.startsWith('POSITION:')) {
                    let p = d.substring(9).split(':'); wnpState.positionSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
                else if (d.startsWith('DURATION:')) {
                    let p = d.substring(9).split(':'); wnpState.durationSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
            };
        }
        connectWNP();

        function getBarColor(temp) {
            if (temp === '--') return 'transparent';
            if (temp <= 40) return '#00d2ff'; if (temp <= 65) return '#a8e063'; 
            if (temp <= 75) return '#f6d365'; return '#ff416c'; 
        }

        window.nzxt = {
            v1: {
                onMonitoringDataUpdate: (data) => {
                    const { cpus, gpus } = data;
                    if (cpus?.length > 0) { cpuTemp = Math.round(cpus[0].temperature); cpuLoad = Math.round(cpus[0].load <= 1 ? cpus[0].load * 100 : cpus[0].load); }
                    if (gpus?.length > 0) { gpuTemp = Math.round(gpus[0].temperature); gpuLoad = Math.round(gpus[0].load <= 1 ? gpus[0].load * 100 : gpus[0].load); }
                    
                    let mx = Math.max(cpuTemp !== '--' ? cpuTemp : 0, gpuTemp !== '--' ? gpuTemp : 0);
                    if (mx > 55) elGlass.className = 'fire-tint'; else if (mx < 40 && mx > 0) elGlass.className = 'ice-tint'; else elGlass.className = '';

                    document.getElementById('cpu-t').innerText = cpuTemp; document.getElementById('cpu-l').innerText = cpuLoad;
                    document.getElementById('gpu-t').innerText = gpuTemp; document.getElementById('gpu-l').innerText = gpuLoad;

                    if (cpuTemp !== '--') { document.getElementById('cpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(cpuTemp, 100) / 100); document.getElementById('cpu-bar-fill').style.stroke = getBarColor(cpuTemp); }
                    if (cpuLoad !== '--') { document.getElementById('cpu-load-fill').style.strokeDashoffset = 465 - (465 * Math.min(cpuLoad, 100) / 100); document.getElementById('cpu-load-fill').style.stroke = getBarColor(cpuLoad); }
                    if (gpuTemp !== '--') { document.getElementById('gpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(gpuTemp, 100) / 100); document.getElementById('gpu-bar-fill').style.stroke = getBarColor(gpuTemp); }
                    if (gpuLoad !== '--') { document.getElementById('gpu-load-fill').style.strokeDashoffset = 465 - (465 * Math.min(gpuLoad, 100) / 100); document.getElementById('gpu-load-fill').style.stroke = getBarColor(gpuLoad); }
                }
            }
        };

        async function fetchNews() {
            if (Date.now() - lastNewsFetchTime < 120000) return; lastNewsFetchTime = Date.now();
            try {
                let r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-16.6799&longitude=-49.2562&current_weather=true');
                goianiaWeather = (await r.json()).current_weather;
                newsList = [];
                for (let k of activeSources) {
                    let d = await (await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${RSS_FEEDS[k].url}`)).json();
                    d.items?.forEach(i => {
                        let img = i.enclosure?.link || i.thumbnail || (i.description.match(/<img[^>]+src="([^">]+)"/) || [])[1] || '';
                        if (img) newsList.push({ title: i.title, source: RSS_FEEDS[k].name, image: img });
                    });
                }
                newsList.sort(() => Math.random() - 0.5); currentNewsIndex = 0; 
            } catch (e) {}
        }
        fetchNews();

        function updateUI(bg, t, a, al, isNews) {
            if (bg) { elBgLayer.className = ''; elBgLayer.style.backgroundImage = `url('${bg}')`; elCenterVisual.innerHTML = `<img class="cover-circle" src="${bg}">`; } 
            else { elBgLayer.style.backgroundImage = 'none'; elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg'; elCenterVisual.innerHTML = fallbackBarsHTML; }
            if (isNews) { elTitle.className = 'title news-mode'; elArtist.className = 'artist news-mode'; elAlbum.style.display = 'none'; if (goianiaWeather) { elWeatherBox.style.display = 'flex'; elWeatherBox.innerHTML = `${Math.round(goianiaWeather.temperature)}°C`; } } 
            else { elTitle.className = 'title'; elArtist.className = 'artist'; elWeatherBox.style.display = 'none'; if(al) { elAlbum.style.display = 'block'; elAlbum.innerText = al; } else elAlbum.style.display = 'none'; }
            elTitle.innerText = t; elArtist.innerText = a;
        }

        function startNewsCycle() {
            if (newsInterval) return;
            const u = () => {
                if (!newsList.length) return;
                const i = newsList[currentNewsIndex];
                const img = new Image(); img.onload = () => updateUI(i.image, i.title, i.source, null, true); img.onerror = () => updateUI('', i.title, i.source, null, true); img.src = i.image;
                currentNewsIndex = (currentNewsIndex + 1) % newsList.length;
            };
            u(); newsInterval = setInterval(u, 15000); 
        }

        function stopNewsCycle() { if (newsInterval) { clearInterval(newsInterval); newsInterval = null; } }

        setInterval(() => {
            const c = document.getElementById('music-ring-container');
            if (pTracker.active && pTracker.durSec > 0) {
                c.style.display = 'block'; pTracker.posSec = Math.min(pTracker.posSec + 1, pTracker.durSec);
                let o = 427 - (427 * (pTracker.posSec / pTracker.durSec));
                document.getElementById('music-progress-left').style.strokeDashoffset = o; document.getElementById('music-progress-right').style.strokeDashoffset = o;
            } else { c.style.display = 'none'; }
        }, 1000);

        async function getNowPlaying() {
            let isP = false; let sn = ''; let an = ''; let al = ''; let dc = ''; let hasP = false; let tp = 0; let td = 0;
            if (wnpConnected && wnpState.state === 1) { isP = true; sn = wnpState.title; an = wnpState.artist; dc = wnpState.coverUrl; if (wnpState.durationSec > 0) { hasP = true; tp = wnpState.positionSec; td = wnpState.durationSec; } }
            if (!isP) {
                try {
                    const lfm = await (await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`)).json();
                    const tr = lfm.recenttracks.track[0];
                    if (tr['@attr']?.nowplaying === 'true') { isP = true; sn = tr.name; an = tr.artist['#text']; dc = tr.image?.[3]?.[`#text`]?.replace('http://', 'https://') || ''; }
                } catch (e) { }
            }
            pTracker.active = hasP; pTracker.posSec = tp; pTracker.durSec = td;
            if (isP) {
                const tId = `${sn}-${an}`;
                if (currentTrackUrl !== tId || currentStatus !== 'playing') {
                    currentTrackUrl = tId; currentStatus = 'playing'; stopNewsCycle(); 
                    const clean = encodeURIComponent((sn || '').replace(/\(.*?\)/g, '').replace(/[-_]/g, ' ').trim());
                    let cv = dc; 
                    if(!cv) { try { cv = (await (await fetch(`https://itunes.apple.com/search?term=${clean}&media=music&entity=song&limit=1`)).json()).results[0]?.artworkUrl100.replace('100x100bb', '600x600bb') || ''; } catch(e){} }
                    const img = new Image(); img.onload = () => updateUI(cv, sn, an, al, false); img.onerror = () => updateUI('', sn, an, al, false); img.src = cv || 'empty';
                }
            } else { if (currentStatus !== 'paused') { currentStatus = 'paused'; currentTrackUrl = ''; pTracker.active = false; startNewsCycle(); } }
        }
        getNowPlaying(); setInterval(getNowPlaying, 5000); 
    </script>
</body>
</html>
