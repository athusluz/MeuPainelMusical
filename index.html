<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Kraken Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            background-color: #000; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-blur {
            position: absolute;
            top: -10%; 
            left: -10%;
            width: 120%; 
            height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.35);
            z-index: 1;
            transition: background-image 1s ease-in-out;
        }

        #music-widget { 
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
        }

        .cover { 
            width: 320px; 
            height: 320px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            margin-bottom: 25px; 
            object-fit: cover;
            transition: opacity 0.5s ease;
        }

        .title { 
            font-size: 42px; 
            font-weight: bold; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }

        .artist { 
            color: #b3b3b3; 
            font-size: 28px; 
            font-weight: 500;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }

        .status { 
            margin-top: 20px; 
            font-size: 18px; 
            color: #ffffff; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-playing {
            color: #1db954;
        }

        .status-playing::before {
            content: '▶';
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="bg-blur"></div>

    <div id="music-widget">
        <p style="font-size: 24px; color: #b3b3b3;">Conectando ao Last.fm...</p>
    </div>

    <script>
        // === DADOS DE ACESSO ===
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 
        // =======================

        // Placeholder premium em SVG (Disco de Vinil Minimalista)
        const fallbackCover = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640"><rect width="640" height="640" fill="%23121212"/><circle cx="320" cy="320" r="220" fill="%231e1e1e"/><circle cx="320" cy="320" r="210" fill="none" stroke="%232a2a2a" stroke-width="2"/><circle cx="320" cy="320" r="150" fill="none" stroke="%232a2a2a" stroke-width="2"/><circle cx="320" cy="320" r="80" fill="%23e0e0e0"/><circle cx="320" cy="320" r="25" fill="%23121212"/></svg>`;

        async function getNowPlaying() {
            const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const track = data.recenttracks.track[0];
                const isPlaying = track['@attr'] && track['@attr'].nowplaying === 'true';

                const widget = document.getElementById('music-widget');
                const bgBlur = document.getElementById('bg-blur');

                if (isPlaying) {
                    const songName = track.name;
                    const artistName = track.artist['#text'];
                    
                    let coverUrl = track.image?.[3]?.['#text'] || '';

                    if (coverUrl.startsWith('http://')) {
                        coverUrl = coverUrl.replace('http://', 'https://');
                    }

                    if (!coverUrl || coverUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                        try {
                            const query = encodeURIComponent(`${artistName} ${songName}`);
                            const itunesRes = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=1`);
                            const itunesData = await itunesRes.json();
                            
                            if (itunesData.results && itunesData.results.length > 0) {
                                coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                            } else {
                                coverUrl = fallbackCover; 
                            }
                        } catch (e) {
                            coverUrl = fallbackCover;
                        }
                    }

                    bgBlur.style.backgroundImage = `url('${coverUrl}')`;
                    widget.innerHTML = `
                        <img class="cover" src="${coverUrl}" alt="Capa do Álbum">
                        <div class="title">${songName}</div>
                        <div class="artist">${artistName}</div>
                        <div class="status status-playing">Tocando agora</div>
                    `;
                } else {
                    bgBlur.style.backgroundImage = 'none';
                    widget.innerHTML = `
                        <img class="cover" src="${fallbackCover}" alt="Vinil">
                        <div class="title" style="color: #b3b3b3;">Nenhuma música</div>
                        <div class="artist" style="font-size: 20px;">O silêncio também é música...</div>
                    `;
                }
            } catch (error) {
                console.error("Erro ao buscar a música:", error);
                document.getElementById('music-widget').innerHTML = "<p style='font-size: 24px; color: #ff4a4a;'>Erro de conexão</p>";
            }
        }

        getNowPlaying();
        setInterval(getNowPlaying, 10000);
    </script>
</body>
</html>
