<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Kraken Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        /* Fundo Dinâmico Holográfico/Aurora */
        #bg-layer {
            position: absolute;
            top: -10%; 
            left: -10%;
            width: 120%; 
            height: 120%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: all 1s ease-in-out;
        }

        /* Classe que ativa o gradiente animado claro quando não há capa */
        .aurora-bg {
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fecfef, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Efeito de Vidro Fosco sobre o fundo */
        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15); /* Escurece de leve para dar contraste ao texto */
            backdrop-filter: blur(25px);
            z-index: 2;
        }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
        }

        /* Estilo da Capa Circular */
        .cover-circle { 
            width: 270px; 
            height: 270px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.2); 
            margin-bottom: 25px; 
            object-fit: cover;
        }

        /* Animação Pulsante caso não tenha capa nenhuma */
        .fallback-pulse {
            width: 270px;
            height: 270px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.1) 100%);
            margin-bottom: 25px;
            animation: pulse 2s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .title { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 3px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }

        .artist { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="aurora-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        <p style="font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Conectando ao Last.fm...</p>
    </div>

    <script>
        // === DADOS DE ACESSO ===
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 
        // =======================

        async function getNowPlaying() {
            const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const track = data.recenttracks.track[0];
                const isPlaying = track['@attr'] && track['@attr'].nowplaying === 'true';

                const widget = document.getElementById('music-widget');
                const bgLayer = document.getElementById('bg-layer');

                if (isPlaying) {
                    const songName = track.name;
                    const artistName = track.artist['#text'];
                    const albumName = track.album && track.album['#text'] ? track.album['#text'] : '';
                    
                    let coverUrl = track.image?.[3]?.['#text'] || '';

                    if (coverUrl.startsWith('http://')) {
                        coverUrl = coverUrl.replace('http://', 'https://');
                    }

                    // Se não tiver capa, tentamos o iTunes
                    if (!coverUrl || coverUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                        try {
                            // O comando normalize('NFKC') converte fontes vaporwave (ｖａｎｉｓｈｅｄ) para letras normais (vanished) para a busca funcionar
                            const queryArtist = artistName.normalize('NFKC');
                            const querySong = songName.normalize('NFKC');
                            
                            const query = encodeURIComponent(`${queryArtist} ${querySong}`);
                            const itunesRes = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=1`);
                            const itunesData = await itunesRes.json();
                            
                            if (itunesData.results && itunesData.results.length > 0) {
                                coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                            } else {
                                coverUrl = ''; // Define como vazio para acionar a animação
                            }
                        } catch (e) {
                            coverUrl = '';
                        }
                    }

                    // Monta o visual de acordo com a existência da capa (sem quebrar HTML)
                    let visualHTML = '';
                    if (coverUrl !== '') {
                        // Com Capa
                        bgLayer.className = ''; 
                        bgLayer.style.backgroundImage = `url('${coverUrl}')`;
                        visualHTML = `<img class="cover-circle" src="${coverUrl}" alt="Capa">`;
                    } else {
                        // Sem Capa (Fallback Limpo Animado)
                        bgLayer.style.backgroundImage = 'none';
                        bgLayer.className = 'aurora-bg'; 
                        visualHTML = `<div class="fallback-pulse"></div>`;
                    }

                    widget.innerHTML = `
                        ${visualHTML}
                        <div class="title">${songName}</div>
                        <div class="artist">${artistName}</div>
                        <div class="album">${albumName}</div>
                    `;
                } else {
                    bgLayer.style.backgroundImage = 'none';
                    bgLayer.className = 'aurora-bg';
                    widget.innerHTML = `
                        <div class="fallback-pulse" style="animation: none; opacity: 0.2;"></div>
                        <div class="title">Nenhuma música</div>
                        <div class="artist" style="font-weight: 400;">O silêncio...</div>
                    `;
                }
            } catch (error) {
                console.error("Erro ao buscar a música:", error);
                document.getElementById('music-widget').innerHTML = "<p style='font-size: 24px; color: #ff4a4a;'>Erro de conexão</p>";
            }
        }

        getNowPlaying();
        setInterval(getNowPlaying, 10000);
    </script>
</body>
</html>
