<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Híbrido Kraken Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            top: -10%; 
            left: -10%;
            width: 120%; 
            height: 120%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: all 1s ease-in-out;
        }

        .aurora-bg {
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fecfef, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); 
            backdrop-filter: blur(25px);
            z-index: 2;
        }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
        }

        .cover-circle { 
            width: 270px; 
            height: 270px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.2); 
            margin-bottom: 25px; 
            object-fit: cover;
        }

        .bars-container {
            width: 270px;
            height: 270px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .bar {
            width: 12px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            animation: bounce 1s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.4s; }
        .bar:nth-child(3) { animation-duration: 0.5s; animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.5s; }
        .bar:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 30px; transform: scaleY(1); }
            100% { height: 140px; transform: scaleY(1.1); }
        }

        .title { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 3px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }

        .artist { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        
        .source-badge {
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 12px;
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="aurora-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        <p style="font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Inicializando Sistema Híbrido...</p>
    </div>

    <script>
        // CONFIGURAÇÕES LAST.FM
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 

        // VARIÁVEIS DE CONTROLE
        let currentTrackUrl = '';
        let currentStatus = ''; 

        const fallbackHTML = `
            <div class="bars-container">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        `;

        // Função reutilizável para buscar capas no iTunes
        async function fetchItunesCover(artist, song) {
            try {
                const queryArtist = artist.normalize('NFKC');
                const querySong = song.normalize('NFKC');
                const query = encodeURIComponent(`${queryArtist} ${querySong}`);
                const itunesRes = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=1`);
                const itunesData = await itunesRes.json();
                
                if (itunesData.results && itunesData.results.length > 0) {
                    return itunesData.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                }
            } catch (e) {
                console.error("Erro no iTunes:", e);
            }
            return '';
        }

        async function getNowPlaying() {
            let isPlaying = false;
            let songName = '';
            let artistName = '';
            let albumName = '';
            let coverUrl = '';
            let activeSource = '';

            // TENTATIVA 1: Bater no Media Player Classic (Local)
            try {
                const mpcRes = await fetch('http://localhost:13579/variables.html');
                const text = await mpcRes.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, "text/html");
                const state = doc.getElementById('state')?.innerText || '0';
                
                if (state === '2') { // 2 = Tocando no MPC
                    isPlaying = true;
                    activeSource = 'MPC-HC';
                    
                    const rawFile = doc.getElementById('file')?.innerText || '';
                    let cleanName = rawFile.replace(/\\.[^/.]+$/, ""); // Tira a extensão
                    
                    artistName = "Arquivo Local";
                    songName = cleanName;

                    if (cleanName.includes(" - ")) {
                        const parts = cleanName.split(" - ");
                        artistName = parts[0].trim();
                        songName = parts.slice(1).join(" - ").trim();
                    }
                    
                    // Busca capa no iTunes pro arquivo local
                    coverUrl = await fetchItunesCover(artistName, songName);
                }
            } catch (e) {
                // MPC fechado ou sem resposta, segue para o Last.fm silenciosamente
            }

            // TENTATIVA 2: Se o MPC não estiver tocando, checa o Last.fm (Navegador)
            if (!isPlaying) {
                try {
                    const lfmUrl = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`;
                    const lfmRes = await fetch(lfmUrl);
                    const lfmData = await lfmRes.json();
                    const track = lfmData.recenttracks.track[0];
                    
                    if (track['@attr'] && track['@attr'].nowplaying === 'true') {
                        isPlaying = true;
                        activeSource = 'Navegador';
                        songName = track.name;
                        artistName = track.artist['#text'];
                        albumName = track.album && track.album['#text'] ? `<div class="album">${track.album['#text']}</div>` : '';
                        
                        coverUrl = track.image?.[3]?.[`#text`] || '';
                        if (coverUrl.startsWith('http://')) coverUrl = coverUrl.replace('http://', 'https://');

                        if (!coverUrl || coverUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                            coverUrl = await fetchItunesCover(artistName, songName);
                        }
                    }
                } catch (error) {
                    console.error("Erro no Last.fm:", error);
                }
            }

            // ATUALIZAÇÃO DA TELA (Com lógica anti-reset)
            const widget = document.getElementById('music-widget');
            const bgLayer = document.getElementById('bg-layer');

            if (isPlaying) {
                const trackIdentifier = `${activeSource}-${songName}-${artistName}`;

                if (currentTrackUrl !== trackIdentifier || currentStatus !== 'playing') {
                    currentTrackUrl = trackIdentifier;
                    currentStatus = 'playing';

                    let visualHTML = '';
                    if (coverUrl !== '') {
                        bgLayer.className = ''; 
                        bgLayer.style.backgroundImage = `url('${coverUrl}')`;
                        visualHTML = `<img class="cover-circle" src="${coverUrl}" alt="Capa">`;
                    } else {
                        bgLayer.style.backgroundImage = 'none';
                        bgLayer.className = 'aurora-bg'; 
                        visualHTML = fallbackHTML;
                    }

                    // Exibe a música e uma pequena tag cinza mostrando se veio do MPC ou do Navegador
                    widget.innerHTML = `
                        ${visualHTML}
                        <div class="title">${songName}</div>
                        <div class="artist">${artistName}</div>
                        ${albumName}
                        <div class="source-badge">Via ${activeSource}</div>
                    `;
                }
            } else {
                if (currentStatus !== 'paused') {
                    currentStatus = 'paused';
                    currentTrackUrl = '';

                    bgLayer.style.backgroundImage = 'none';
                    bgLayer.className = 'aurora-bg';
                    widget.innerHTML = `
                        <div class="bars-container" style="opacity: 0.3; border-style: dashed;">
                            <div class="bar" style="animation: none; height: 20px;"></div>
                            <div class="bar" style="animation: none; height: 20px;"></div>
                            <div class="bar" style="animation: none; height: 20px;"></div>
                            <div class="bar" style="animation: none; height: 20px;"></div>
                            <div class="bar" style="animation: none; height: 20px;"></div>
                        </div>
                        <div class="title">Nenhuma música</div>
                        <div class="artist" style="font-weight: 400;">O silêncio...</div>
                    `;
                }
            }
        }

        // Como o Last.fm prefere intervalos maiores e o MPC aguenta intervalos curtos,
        // 5 segundos é um meio-termo perfeito e seguro para buscar nos dois sistemas.
        getNowPlaying();
        setInterval(getNowPlaying, 5000); 
    </script>
</body>
</html>
