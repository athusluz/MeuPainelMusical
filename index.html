<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Kraken V6 (Arcos, Notícias & Capas Aleatórias)</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            top: -10%; 
            left: -10%;
            width: 120%; 
            height: 120%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: background-image 0.5s ease-in-out;
        }

        .aurora-bg { background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fecfef, #ff9a9e); }
        .dark-bg { background-color: #050505; background-image: none; }

        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(20px); 
            z-index: 2;
            transition: background 1s ease;
        }

        #glass-overlay.fire-tint { background: rgba(180, 20, 50, 0.45) !important; }
        #glass-overlay.ice-tint { background: rgba(0, 100, 150, 0.45) !important; }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
            transform: scale(1);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .dashboard-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 25px;
            position: relative;
        }

        .cover-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5; 
            position: relative;
            width: 340px;
            height: 340px;
            justify-content: center;
        }

        /* --- TEMPERATURAS DINÂMICAS QUE SEGUEM A BARRA --- */
        .minimal-temp {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 22px; 
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            z-index: 10;
            transform: translate(-50%, -50%); /* Garante o alinhamento centralizado no ponto exato */
            transition: color 0.5s ease, left 0.5s ease-out, top 0.5s ease-out; /* Transição suave de movimento */
            line-height: 1;
        }

        .minimal-temp .hw-bar-unit { 
            font-size: 13px; 
            opacity: 0.8; 
            margin-left: 1px; 
        }

        .minimal-label {
            font-size: 11px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.8;
            margin-top: 2px;
        }
        /* ------------------------------------------------ */

        #center-visual-container {
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cover-circle { 
            width: 272px;  
            height: 272px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8); 
            object-fit: cover;
            aspect-ratio: 1 / 1; 
            display: block;
        }

        .bars-container {
            width: 272px;
            height: 272px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .bar {
            width: 12px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            transform-origin: center;
            transform: scaleY(0.1); 
            transition: transform 0.5s ease;
        }

        .bar.animated { animation: bounce-opt 1s ease-in-out infinite alternate; }
        .bar.animated:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .bar.animated:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.4s; }
        .bar.animated:nth-child(3) { animation-duration: 0.5s; animation-delay: 0.2s; }
        .bar.animated:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.5s; }
        .bar.animated:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.3s; }

        @keyframes bounce-opt {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1.2); }
        }

        .title { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            letter-spacing: 1px;
            padding: 0 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .title.news-mode {
            white-space: normal;
            font-size: 26px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .artist { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .artist.news-mode {
            font-size: 18px;
            color: #ccc;
        }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="aurora-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        
        <div class="dashboard-container">
            
            <div class="cover-wrapper">
                
                <div id="cpu-minimal" class="minimal-temp" style="display: none;">
                    <div><span id="cpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                    <div class="minimal-label">CPU</div>
                </div>

                <svg width="340" height="340" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none;">
                    <g transform="rotate(90, 170, 170)">
                        <path d="M 170,332 A 162 162 0 0 1 170 8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                        <path d="M 170,332 A 162 162 0 0 0 170 8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                        
                        <g id="music-bg-ring" style="display: none;">
                            <path d="M 170,316 A 146 146 0 0 1 170 24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                            <path d="M 170,316 A 146 146 0 0 0 170 24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                        </g>

                        <path id="cpu-bar-fill" d="M 170,332 A 162 162 0 0 1 170 8" fill="none" stroke="transparent" stroke-width="8" stroke-dasharray="509" stroke-dashoffset="509" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease;"/>
                        <path id="gpu-bar-fill" d="M 170,332 A 162 162 0 0 0 170 8" fill="none" stroke="transparent" stroke-width="8" stroke-dasharray="509" stroke-dashoffset="509" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease;"/>
                        
                        <g id="music-progress" style="display: none;">
                            <path id="music-progress-left" d="M 170,316 A 146 146 0 0 1 170 24" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="459" stroke-dashoffset="459" stroke-linecap="round" style="transition: stroke-dashoffset 1s linear;" />
                            <path id="music-progress-right" d="M 170,316 A 146 146 0 0 0 170 24" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="459" stroke-dashoffset="459" stroke-linecap="round" style="transition: stroke-dashoffset 1s linear;" />
                        </g>
                    </g>
                </svg>

                <div id="center-visual-container">
                    <div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
                </div>

                <div id="gpu-minimal" class="minimal-temp" style="display: none;">
                    <div><span id="gpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                    <div class="minimal-label">GPU</div>
                </div>

            </div>
        </div>

        <div id="info-title" class="title">Inicializando...</div>
        <div id="info-artist" class="artist"></div>
        <div id="info-album" class="album"></div>
    </div>

    <script>
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 

        const RSS_FEEDS = {
            'g1': { url: 'https://g1.globo.com/rss/g1/', name: 'G1' },
            'esports': { url: 'https://ge.globo.com/rss/esports/', name: 'e-Sports' },
            'tecnologia': { url: 'https://g1.globo.com/rss/g1/tecnologia/', name: 'Tecnologia' },
            'pop': { url: 'https://g1.globo.com/rss/g1/pop-arte/', name: 'Pop & Arte' }
        };
        let activeSources = Object.keys(RSS_FEEDS);
        let newsList = [];
        let currentNewsIndex = 0;
        let newsInterval = null;
        let lastNewsFetchTime = 0;

        let currentTrackUrl = ''; let currentStatus = ''; 
        let cpuTemp = '--'; let gpuTemp = '--';

        const cache = {
            cpuT: null, gpuT: null, glassClass: null, musicOffset: null
        };

        const elWidget = document.getElementById('music-widget');
        const elBgLayer = document.getElementById('bg-layer');
        const elCenterVisual = document.getElementById('center-visual-container');
        const elTitle = document.getElementById('info-title');
        const elArtist = document.getElementById('info-artist');
        const elAlbum = document.getElementById('info-album');
        const elGlass = document.getElementById('glass-overlay');

        const fallbackBarsAnimatedHTML = `<div class="bars-container"><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div></div>`;
        const fallbackBarsFlatHTML = `<div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;

        let pTracker = { active: false, posSec: 0, durSec: 0 };
        let wnpConnected = false;
        let wnpState = { state: 0, title: '', artist: '', album: '', coverUrl: '', positionSec: 0, durationSec: 0 };
        
        function connectWNP() {
            let ws = new WebSocket('ws://127.0.0.1:8999');
            ws.onopen = () => wnpConnected = true;
            ws.onclose = () => { wnpConnected = false; setTimeout(connectWNP, 10000); };
            ws.onmessage = (e) => {
                const d = e.data;
                if (d.startsWith('STATE:')) wnpState.state = parseInt(d.substring(6));
                else if (d.startsWith('TITLE:')) wnpState.title = d.substring(6);
                else if (d.startsWith('ARTIST:')) wnpState.artist = d.substring(7);
                else if (d.startsWith('ALBUM:')) wnpState.album = d.substring(6);
                else if (d.startsWith('COVER:')) wnpState.coverUrl = d.substring(6);
                else if (d.startsWith('POSITION:')) {
                    let p = d.substring(9).split(':'); wnpState.positionSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
                else if (d.startsWith('DURATION:')) {
                    let p = d.substring(9).split(':'); wnpState.durationSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
            };
        }
        connectWNP();

        function getBarColor(temp) {
            if (temp === '--') return 'transparent';
            if (temp <= 40) return '#00d2ff'; if (temp <= 65) return '#a8e063'; 
            if (temp <= 75) return '#f6d365'; return '#ff416c'; 
        }

        // --- FUNÇÃO MATEMÁTICA PARA CALCULAR A POSIÇÃO NA BORDA DA BARRA ---
        function updateTempPosition(pathId, elementId, temp) {
            const path = document.getElementById(pathId);
            const element = document.getElementById(elementId);
            if (!path || !element || temp === '--') return;

            const totalLength = 509; 
            // Calcula o comprimento correspondente à temperatura atual
            const currentLength = (Math.min(temp, 100) / 100) * totalLength;
            
            // Pega as coordenadas X e Y locais da ponta da curva antes da rotação do SVG
            const pt = path.getPointAtLength(currentLength);
            
            const cx = 170; // Centro do widget (340 / 2)
            const cy = 170;
            
            // Vetores de distância do centro
            const vx = pt.x - cx;
            const vy = pt.y - cy;
            
            // Afastamento do texto para o lado de fora (Raio original do arco é 162 + margem externa)
            const targetRadius = 196; 
            const currentRadius = 162;
            const scale = targetRadius / currentRadius;
            
            const outerX = cx + vx * scale;
            const outerY = cy + vy * scale;
            
            // Aplica a rotação de 90° idêntica ao grupo SVG para alinhar perfeitamente com a renderização da tela
            const finalX = cx - (outerY - cy);
            const finalY = cy + (outerX - cx);
            
            // Atualiza o CSS inline do elemento de texto
            element.style.left = `${finalX}px`;
            element.style.top = `${finalY}px`;
        }

        window.nzxt = {
            v1: {
                onMonitoringDataUpdate: (data) => {
                    const { cpus, gpus } = data;
                    if (cpus?.length > 0) { cpuTemp = Math.round(cpus[0].temperature); }
                    if (gpus?.length > 0) { gpuTemp = Math.round(gpus[0].temperature); }
                    
                    let mx = Math.max(cpuTemp !== '--' ? cpuTemp : 0, gpuTemp !== '--' ? gpuTemp : 0);
                    let newGlassClass = cache.glassClass || '';
                    
                    if (newGlassClass === 'fire-tint') {
                        if (mx < 60) newGlassClass = '';
                    } else if (newGlassClass === 'ice-tint') {
                        if (mx > 40) newGlassClass = '';
                    } else {
                        if (mx >= 68) newGlassClass = 'fire-tint';
                        else if (mx <= 35 && mx > 0) newGlassClass = 'ice-tint';
                    }
                    
                    if (cache.glassClass !== newGlassClass) {
                        elGlass.className = newGlassClass;
                        cache.glassClass = newGlassClass;
                    }

                    // Atualizando CPU dinamicamente acompanhando o progresso
                    if (cache.cpuT !== cpuTemp) {
                        document.getElementById('cpu-t').innerText = cpuTemp; 
                        if (cpuTemp !== '--') { 
                            let color = getBarColor(cpuTemp);
                            document.getElementById('cpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(cpuTemp, 100) / 100); 
                            document.getElementById('cpu-bar-fill').style.stroke = color; 
                            
                            const elCpuMin = document.getElementById('cpu-minimal');
                            elCpuMin.style.color = color;
                            elCpuMin.style.display = 'flex';
                            updateTempPosition('cpu-bar-fill', 'cpu-minimal', cpuTemp);
                        } else {
                            document.getElementById('cpu-minimal').style.display = 'none';
                        }
                        cache.cpuT = cpuTemp;
                    }

                    // Atualizando GPU dinamicamente acompanhando o progresso
                    if (cache.gpuT !== gpuTemp) {
                        document.getElementById('gpu-t').innerText = gpuTemp; 
                        if (gpuTemp !== '--') { 
                            let color = getBarColor(gpuTemp);
                            document.getElementById('gpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(gpuTemp, 100) / 100); 
                            document.getElementById('gpu-bar-fill').style.stroke = color; 
                            
                            const elGpuMin = document.getElementById('gpu-minimal');
                            elGpuMin.style.color = color;
                            elGpuMin.style.display = 'flex';
                            updateTempPosition('gpu-bar-fill', 'gpu-minimal', gpuTemp);
                        } else {
                            document.getElementById('gpu-minimal').style.display = 'none';
                        }
                        cache.gpuT = gpuTemp;
                    }
                }
            }
        };

        function preloadImageAndUpdate(imageUrl, updateCallback) {
            const fadeDuration = 500; 
            const startTime = Date.now();
            const triggerUpdate = () => {
                const elapsed = Date.now() - startTime;
                const remainingDelay = Math.max(0, fadeDuration - elapsed);
                setTimeout(updateCallback, remainingDelay);
            };

            if (imageUrl) {
                const img = new Image();
                img.onload = triggerUpdate;
                img.onerror = triggerUpdate; 
                img.src = imageUrl;
            } else {
                triggerUpdate();
            }
        }

        // --- SISTEMA DE NOTÍCIAS & REPOUSO ---
        async function fetchNews() {
            const now = Date.now();
            if (now - lastNewsFetchTime < 120000) return; 
            lastNewsFetchTime = now;
            try {
                newsList = [];
                for (let k of activeSources) {
                    let response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${RSS_FEEDS[k].url}`);
                    let data = await response.json();
                    if (data.items) {
                        data.items.forEach(item => {
                            let imgUrl = item.enclosure?.link || item.thumbnail || (item.description.match(/<img[^>]+src="([^">]+)"/) || [])[1] || '';
                            if (imgUrl) newsList.push({ title: item.title, source: RSS_FEEDS[k].name, image: imgUrl });
                        });
                    }
                }
                newsList.sort(() => Math.random() - 0.5);
            } catch (error) { }
        }

        function showSilenceState() {
            elTitle.className = 'title'; elArtist.className = 'artist'; elAlbum.style.display = 'none';
            elTitle.innerText = 'Só silencio...'; elArtist.innerText = '';
            elBgLayer.style.backgroundImage = 'none'; 
            elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg'; 
            elCenterVisual.innerHTML = fallbackBarsFlatHTML;
        }

        function showNextNews() {
            if (currentNewsIndex >= newsList.length) {
                stopNewsCycle();
                elWidget.style.opacity = 0; 
                elWidget.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    showSilenceState();
                    elWidget.style.opacity = 1; 
                    elWidget.style.transform = 'scale(1)';
                }, 500);
                return;
            }

            const newsItem = newsList[currentNewsIndex];
            
            elBgLayer.style.backgroundImage = 'none'; 
            elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg'; 
            
            if (newsItem.image) {
                elCenterVisual.innerHTML = `<img class="cover-circle" src="${newsItem.image}">`;
            } else {
                elCenterVisual.innerHTML = fallbackBarsFlatHTML;
            }

            elTitle.className = 'title news-mode';
            elArtist.className = 'artist news-mode';
            elAlbum.style.display = 'none';

            elTitle.innerText = newsItem.title;
            elArtist.innerText = newsItem.source;

            currentNewsIndex++;
        }

        function startNewsCycle() {
            if (newsInterval) return;
            fetchNews().then(() => {
                if(newsList.length > 0) {
                    currentNewsIndex = 0;
                    showNextNews();
                    newsInterval = setInterval(showNextNews, 60000); 
                } else {
                    showSilenceState();
                }
            });
        }

        function stopNewsCycle() {
            if (newsInterval) { clearInterval(newsInterval); newsInterval = null; }
        }

        // --- SISTEMA DE PROGRESSO ---
        setInterval(() => {
            const bgRing = document.getElementById('music-bg-ring');
            const progRing = document.getElementById('music-progress');
            const progLeft = document.getElementById('music-progress-left');
            const progRight = document.getElementById('music-progress-right');

            if (pTracker.active && pTracker.durSec > 0) {
                bgRing.style.display = 'block'; 
                progRing.style.display = 'block'; 
                
                pTracker.posSec = Math.min(pTracker.posSec + 1, pTracker.durSec);
                let o = 459 - (459 * (pTracker.posSec / pTracker.durSec));
                
                if (cache.musicOffset !== o) {
                    progLeft.style.strokeDashoffset = o; 
                    progRight.style.strokeDashoffset = o; 
                    cache.musicOffset = o;
                }
            } else { 
                bgRing.style.display = 'none'; 
                progRing.style.display = 'none'; 
                cache.musicOffset = null; 
            }
        }, 1000);

        function cleanStringForSearch(str) {
            if (!str) return '';
            return str.replace(/\(.*?\)/g, ' ').replace(/\[.*?\]/g, ' ').replace(/[-_]/g, ' ')
                .replace(/(ft\.|feat\.|prod\.|remix|official|video|audio|lyrics).*$/i, ' ')
                .replace(/[^a-zA-Z0-9À-ÿ\s]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        async function fetchItunesCover(query) {
            if (!query) return '';
            try {
                let res = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=5`);
                let data = await res.json();
                if (data.results && data.results.length > 0) {
                    let maxIdx = Math.min(data.results.length, 3);
                    let randomIdx = Math.floor(Math.random() * maxIdx);
                    return data.results[randomIdx].artworkUrl100.replace('100x100bb', '600x600bb');
                }
            } catch (e) { }
            return '';
        }

        // --- NÚCLEO MUSICAL ---
        async function getNowPlaying() {
            let isP = false; let sn = ''; let an = ''; let al = ''; let dc = ''; let hasP = false; let tp = 0; let td = 0;
            
            if (wnpConnected && wnpState.state === 1) { 
                isP = true; sn = wnpState.title; an = wnpState.artist; al = wnpState.album; dc = wnpState.coverUrl; 
                if (wnpState.durationSec > 0) { hasP = true; tp = wnpState.positionSec; td = wnpState.durationSec; } 
            }
            
            if (!isP) {
                try {
                    const mpcRes = await fetch('http://localhost:13579/variables.html');
                    const text = await mpcRes.text();
                    const doc = new DOMParser().parseFromString(text, "text/html");
                    if (doc.getElementById('state')?.innerText === '2') { 
                        isP = true; 
                        let cleanName = (doc.getElementById('file')?.innerText || '').replace(/\.[^/.]+$/, ""); 
                        an = "Desconhecido"; sn = cleanName;
                        if (cleanName.includes(" - ")) {
                            const parts = cleanName.split(" - ");
                            an = parts[0].trim(); sn = parts.slice(1).join(" - ").trim();
                        }
                        const posStr = doc.getElementById('positionstring')?.innerText;
                        const durStr = doc.getElementById('durationstring')?.innerText;
                        if (durStr && durStr !== '00:00:00') { 
                            hasP = true; 
                            const parseTime = (s) => {
                                if (!s) return 0;
                                let p = s.split(':');
                                return p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : (p.length === 3 ? parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]) : 0);
                            };
                            tp = parseTime(posStr); td = parseTime(durStr); 
                        }
                    }
                } catch (e) {}
            }

            if (!isP) {
                try {
                    const lfm = await (await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`)).json();
                    const tr = lfm.recenttracks.track[0];
                    if (tr['@attr']?.nowplaying === 'true') { isP = true; sn = tr.name; an = tr.artist['#text']; al = tr.album?.['#text']; dc = tr.image?.[3]?.[`#text`]?.replace('http://', 'https://') || ''; }
                } catch (e) { }
            }
            
            pTracker.active = hasP; pTracker.posSec = tp; pTracker.durSec = td;
            
            if (isP) {
                const tId = `${sn}-${an}`;
                if (currentTrackUrl !== tId || currentStatus !== 'playing') {
                    currentTrackUrl = tId; currentStatus = 'playing';
                    stopNewsCycle();
                    
                    elWidget.style.opacity = 0; 
                    elWidget.style.transform = 'scale(0.95)';

                    const cleanArtist = cleanStringForSearch(an).normalize('NFKC');
                    const cleanSong = cleanStringForSearch(sn).normalize('NFKC');
                    
                    let coverUrl = '';
                    let exactCover = await fetchItunesCover(encodeURIComponent(`${cleanArtist} ${cleanSong}`));
                    
                    if (exactCover) {
                        coverUrl = exactCover;
                    } else if (dc) {
                        coverUrl = dc;
                    } else if (cleanSong.length > 0) {
                        coverUrl = await fetchItunesCover(encodeURIComponent(cleanSong));
                    }

                    preloadImageAndUpdate(coverUrl, () => {
                        elTitle.className = 'title'; elArtist.className = 'artist';
                        
                        if (coverUrl !== '') {
                            elBgLayer.className = ''; elBgLayer.style.backgroundImage = `url('${coverUrl}')`;
                            elCenterVisual.innerHTML = `<img class="cover-circle" src="${coverUrl}">`;
                        } else {
                            elBgLayer.style.backgroundImage = 'none'; 
                            elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg'; 
                            elCenterVisual.innerHTML = fallbackBarsAnimatedHTML;
                        }

                        elTitle.innerText = sn;
                        elArtist.innerText = an;
                        if(al) { elAlbum.style.display = 'block'; elAlbum.innerText = al; } else { elAlbum.style.display = 'none'; }

                        elWidget.style.opacity = 1; 
                        elWidget.style.transform = 'scale(1)';
                        
                        // Atualiza as posições imediatamente após renderizar a música
                        updateTempPosition('cpu-bar-fill', 'cpu-minimal', cpuTemp);
                        updateTempPosition('gpu-bar-fill', 'gpu-minimal', gpuTemp);
                    });
                }
            } else { 
                if (currentStatus !== 'paused') { 
                    currentStatus = 'paused'; currentTrackUrl = ''; pTracker.active = false; 
                    
                    elWidget.style.opacity = 0; 
                    elWidget.style.transform = 'scale(0.95)';
                    
                    setTimeout(() => {
                        showSilenceState();
                        elWidget.style.opacity = 1; 
                        elWidget.style.transform = 'scale(1)';
                        
                        startNewsCycle();
                    }, 500);
                } 
            }
        }
        
        getNowPlaying(); setInterval(getNowPlaying, 5000); 
    </script>
</body>
</html>
