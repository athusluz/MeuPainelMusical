<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Kraken V6 (Estilo Arcos)</title>

    <!-- 
    ========================================================================
    RESUMO PARA IA FUTURA (MANUTENÇÃO DO HÍBRIDO KRAKEN V6)
    ========================================================================
    CONTEXTO DO PROJETO:
    Este widget foi rigorosamente otimizado para resolver problemas de alto 
    uso de CPU rodando em background no NZXT CAM.
    A engine do Kraken usa renderização via software (Chromium), o que 
    significa que repaints excessivos causam picos de processamento.

    FUNCIONALIDADES REMOVIDAS/DESATIVADAS PARA PERFORMANCE:
    1. Recriação do DOM (innerHTML): Abolido. O painel possui uma 
       estrutura HTML estática e o JS apenas atualiza `.innerText` ou os 
       offsets do SVG usando a técnica de DOM Diffing (só altera se o valor mudar).
    2. APIs Secundárias: As integrações de Notícias (RSS) e Clima foram 
       removidas para evitar polling de rede e vazamentos de memória.
    3. Animações de Layout (Reflow): A animação das barras de áudio em repouso
       usa `transform: scaleY` ao invés de `height`, rodando via composite.

    ATUALIZAÇÕES DE DESIGN DESTA VERSÃO:
    - Retorno do `backdrop-filter: blur(20px)` para teste de estresse visual.
    - Gráfico central expandido para 266px.
    - Painéis de telemetria redesenhados em cards estilo glassmorphism.
    - Estilo em Arcos: CPU na lateral esquerda, GPU na lateral direita. 
      Progresso de música sobe de forma espelhada por dois arcos internos.
    ========================================================================
    -->

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: background-image 0.5s ease-in-out;
        }

        .aurora-bg { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); }
        .dark-bg { background-color: #050505; background-image: none; }

        /* O Blur está de volta para o teste de desempenho */
        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(20px); 
            z-index: 2;
            transition: background 1s ease;
        }

        #glass-overlay.fire-tint { background: rgba(180, 20, 50, 0.45) !important; }
        #glass-overlay.ice-tint { background: rgba(0, 100, 150, 0.45) !important; }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
        }

        .dashboard-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; 
            width: 100%;
            margin-bottom: 25px;
        }

        /* --- REDESIGN DOS PAINÉIS DE HARDWARE --- */
        .hw-side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 18px 12px;
            z-index: 5;
            width: 110px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .hw-big-icon {
            font-size: 32px; 
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .hw-temp-row {
            font-size: 28px; 
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
            line-height: 1;
            display: flex;
            align-items: baseline;
        }

        .hw-load-row {
            font-size: 15px;
            font-weight: 600;
            color: #b0c4de;
            margin-top: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
        }

        .hw-bar-unit { 
            font-size: 14px; 
            opacity: 0.7; 
            margin-left: 2px; 
        }

        .hw-bar-label {
            font-size: 13px; 
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* --- REDESIGN DA CAPA (Tamanho Máximo) --- */
        .cover-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5; 
            position: relative;
            width: 340px;
            height: 340px;
            justify-content: center;
        }

        #center-visual-container {
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cover-circle { 
            width: 266px; 
            height: 266px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8); 
            object-fit: cover;
            display: block;
        }

        .bars-container {
            width: 266px;
            height: 266px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .bar {
            width: 12px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            transform-origin: center;
            transform: scaleY(0.1); 
            transition: transform 0.5s ease;
        }

        .bar.animated { animation: bounce-opt 1s ease-in-out infinite alternate; }
        .bar.animated:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .bar.animated:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.4s; }
        .bar.animated:nth-child(3) { animation-duration: 0.5s; animation-delay: 0.2s; }
        .bar.animated:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.5s; }
        .bar.animated:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.3s; }

        @keyframes bounce-opt {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1.2); }
        }

        .title { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            letter-spacing: 1px;
            padding: 0 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .artist { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="aurora-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        <div class="dashboard-container">
            
            <div class="hw-side-panel">
                <div class="hw-big-icon" id="cpu-icon">⚡</div>
                <div class="hw-temp-row"><span id="cpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                <div class="hw-load-row"><span id="cpu-l">--</span><span class="hw-bar-unit">%</span></div>
                <div class="hw-bar-label">CPU</div>
            </div>
            
            <div class="cover-wrapper">
                <svg width="340" height="340" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none;">
                    
                    <!-- Fundo das Temperaturas (Raio 162) -->
                    <!-- Esquerda CPU (Sweep 1) -->
                    <path d="M 170,332 A 162 162 0 0 1 170 8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                    <!-- Direita GPU (Sweep 0) -->
                    <path d="M 170,332 A 162 162 0 0 0 170 8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                    
                    <!-- Fundo da Música (Raio 146 - Mais interno) -->
                    <g id="music-bg-ring" style="display: none;">
                        <path d="M 170,316 A 146 146 0 0 1 170 24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 170,316 A 146 146 0 0 0 170 24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                    </g>

                    <!-- Preenchimentos Dinâmicos de Temperatura (Comprimento do arco: 509) -->
                    <path id="cpu-bar-fill" d="M 170,332 A 162 162 0 0 1 170 8" fill="none" stroke="transparent" stroke-width="8" stroke-dasharray="509" stroke-dashoffset="509" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease;"/>
                    <path id="gpu-bar-fill" d="M 170,332 A 162 162 0 0 0 170 8" fill="none" stroke="transparent" stroke-width="8" stroke-dasharray="509" stroke-dashoffset="509" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease;"/>
                    
                    <!-- Preenchimentos Dinâmicos de Música (Comprimento do arco: 459) -->
                    <g id="music-progress" style="display: none;">
                        <path id="music-progress-left" d="M 170,316 A 146 146 0 0 1 170 24" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="459" stroke-dashoffset="459" stroke-linecap="round" style="transition: stroke-dashoffset 1s linear;" />
                        <path id="music-progress-right" d="M 170,316 A 146 146 0 0 0 170 24" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="459" stroke-dashoffset="459" stroke-linecap="round" style="transition: stroke-dashoffset 1s linear;" />
                    </g>

                </svg>

                <div id="center-visual-container"></div>
            </div>
            
            <div class="hw-side-panel">
                <div class="hw-big-icon" id="gpu-icon">⚡</div>
                <div class="hw-temp-row"><span id="gpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                <div class="hw-load-row"><span id="gpu-l">--</span><span class="hw-bar-unit">%</span></div>
                <div class="hw-bar-label">GPU</div>
            </div>
        </div>

        <div id="info-title" class="title">Inicializando...</div>
        <div id="info-artist" class="artist"></div>
        <div id="info-album" class="album"></div>
    </div>

    <script>
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 

        let currentTrackUrl = ''; let currentStatus = ''; 
        let cpuTemp = '--'; let cpuLoad = '--'; let gpuTemp = '--'; let gpuLoad = '--';

        const cache = {
            cpuT: null, cpuL: null, gpuT: null, gpuL: null, glassClass: null, musicOffset: null
        };

        const elBgLayer = document.getElementById('bg-layer');
        const elCenterVisual = document.getElementById('center-visual-container');
        const elTitle = document.getElementById('info-title');
        const elArtist = document.getElementById('info-artist');
        const elAlbum = document.getElementById('info-album');
        const elGlass = document.getElementById('glass-overlay');

        const fallbackBarsAnimatedHTML = `<div class="bars-container"><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div></div>`;
        const fallbackBarsFlatHTML = `<div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;

        let pTracker = { active: false, posSec: 0, durSec: 0 };
        let wnpConnected = false;
        let wnpState = { state: 0, title: '', artist: '', album: '', coverUrl: '', positionSec: 0, durationSec: 0 };
        
        function connectWNP() {
            let ws = new WebSocket('ws://127.0.0.1:8999');
            ws.onopen = () => wnpConnected = true;
            ws.onclose = () => { wnpConnected = false; setTimeout(connectWNP, 10000); };
            ws.onmessage = (e) => {
                const d = e.data;
                if (d.startsWith('STATE:')) wnpState.state = parseInt(d.substring(6));
                else if (d.startsWith('TITLE:')) wnpState.title = d.substring(6);
                else if (d.startsWith('ARTIST:')) wnpState.artist = d.substring(7);
                else if (d.startsWith('ALBUM:')) wnpState.album = d.substring(6);
                else if (d.startsWith('COVER:')) wnpState.coverUrl = d.substring(6);
                else if (d.startsWith('POSITION:')) {
                    let p = d.substring(9).split(':'); wnpState.positionSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
                else if (d.startsWith('DURATION:')) {
                    let p = d.substring(9).split(':'); wnpState.durationSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
            };
        }
        connectWNP();

        function getBarColor(temp) {
            if (temp === '--') return 'transparent';
            if (temp <= 40) return '#00d2ff'; if (temp <= 65) return '#a8e063'; 
            if (temp <= 75) return '#f6d365'; return '#ff416c'; 
        }

        function getStatusIcon(temp) {
            if (temp === '--') return '⚡';
            if (temp <= 30) return '🧊';
            if (temp <= 40) return '❄️';
            if (temp <= 50) return '⚡';
            if (temp <= 60) return '🔥';
            return '🌋';
        }

        window.nzxt = {
            v1: {
                onMonitoringDataUpdate: (data) => {
                    const { cpus, gpus } = data;
                    if (cpus?.length > 0) { cpuTemp = Math.round(cpus[0].temperature); cpuLoad = Math.round(cpus[0].load <= 1 ? cpus[0].load * 100 : cpus[0].load); }
                    if (gpus?.length > 0) { gpuTemp = Math.round(gpus[0].temperature); gpuLoad = Math.round(gpus[0].load <= 1 ? gpus[0].load * 100 : gpus[0].load); }
                    
                    let mx = Math.max(cpuTemp !== '--' ? cpuTemp : 0, gpuTemp !== '--' ? gpuTemp : 0);
                    let newGlassClass = mx > 55 ? 'fire-tint' : (mx < 40 && mx > 0 ? 'ice-tint' : '');
                    
                    if (cache.glassClass !== newGlassClass) {
                        elGlass.className = newGlassClass;
                        cache.glassClass = newGlassClass;
                    }

                    if (cache.cpuT !== cpuTemp) {
                        document.getElementById('cpu-t').innerText = cpuTemp; 
                        document.getElementById('cpu-icon').innerText = getStatusIcon(cpuTemp);
                        if (cpuTemp !== '--') { 
                            // Cálculo baseado em arco de tamanho 509
                            document.getElementById('cpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(cpuTemp, 100) / 100); 
                            document.getElementById('cpu-bar-fill').style.stroke = getBarColor(cpuTemp); 
                        }
                        cache.cpuT = cpuTemp;
                    }

                    if (cache.gpuT !== gpuTemp) {
                        document.getElementById('gpu-t').innerText = gpuTemp; 
                        document.getElementById('gpu-icon').innerText = getStatusIcon(gpuTemp);
                        if (gpuTemp !== '--') { 
                            // Cálculo baseado em arco de tamanho 509
                            document.getElementById('gpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(gpuTemp, 100) / 100); 
                            document.getElementById('gpu-bar-fill').style.stroke = getBarColor(gpuTemp); 
                        }
                        cache.gpuT = gpuTemp;
                    }

                    if (cache.cpuL !== cpuLoad) { document.getElementById('cpu-l').innerText = cpuLoad; cache.cpuL = cpuLoad; }
                    if (cache.gpuL !== gpuLoad) { document.getElementById('gpu-l').innerText = gpuLoad; cache.gpuL = gpuLoad; }
                }
            }
        };

        function updateUI(bg, t, a, al, isPlaying) {
            if (bg) { 
                elBgLayer.className = ''; elBgLayer.style.backgroundImage = `url('${bg}')`; 
                elCenterVisual.innerHTML = `<img class="cover-circle" src="${bg}">`; 
            } else { 
                elBgLayer.style.backgroundImage = 'none'; 
                elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg'; 
                elCenterVisual.innerHTML = isPlaying ? fallbackBarsAnimatedHTML : fallbackBarsFlatHTML; 
            }
            
            elTitle.innerText = t; 
            elArtist.innerText = a;
            if(al) { elAlbum.style.display = 'block'; elAlbum.innerText = al; } else { elAlbum.style.display = 'none'; }
        }

        setInterval(() => {
            const bgRing = document.getElementById('music-bg-ring');
            const progRing = document.getElementById('music-progress');
            const progLeft = document.getElementById('music-progress-left');
            const progRight = document.getElementById('music-progress-right');

            if (pTracker.active && pTracker.durSec > 0) {
                bgRing.style.display = 'block'; 
                progRing.style.display = 'block'; 
                
                pTracker.posSec = Math.min(pTracker.posSec + 1, pTracker.durSec);
                // Cálculo baseado no comprimento dos arcos internos da música (459)
                let o = 459 - (459 * (pTracker.posSec / pTracker.durSec));
                
                if (cache.musicOffset !== o) {
                    progLeft.style.strokeDashoffset = o; 
                    progRight.style.strokeDashoffset = o; 
                    cache.musicOffset = o;
                }
            } else { 
                bgRing.style.display = 'none'; 
                progRing.style.display = 'none'; 
                cache.musicOffset = null; 
            }
        }, 1000);

        async function getNowPlaying() {
            let isP = false; let sn = ''; let an = ''; let al = ''; let dc = ''; let hasP = false; let tp = 0; let td = 0;
            if (wnpConnected && wnpState.state === 1) { isP = true; sn = wnpState.title; an = wnpState.artist; al = wnpState.album; dc = wnpState.coverUrl; if (wnpState.durationSec > 0) { hasP = true; tp = wnpState.positionSec; td = wnpState.durationSec; } }
            if (!isP) {
                try {
                    const lfm = await (await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`)).json();
                    const tr = lfm.recenttracks.track[0];
                    if (tr['@attr']?.nowplaying === 'true') { isP = true; sn = tr.name; an = tr.artist['#text']; al = tr.album?.['#text']; dc = tr.image?.[3]?.[`#text`]?.replace('http://', 'https://') || ''; }
                } catch (e) { }
            }
            pTracker.active = hasP; pTracker.posSec = tp; pTracker.durSec = td;
            
            if (isP) {
                const tId = `${sn}-${an}`;
                if (currentTrackUrl !== tId || currentStatus !== 'playing') {
                    currentTrackUrl = tId; currentStatus = 'playing';
                    const clean = encodeURIComponent((sn || '').replace(/\(.*?\)/g, '').replace(/[-_]/g, ' ').trim());
                    let cv = dc; 
                    if(!cv) { try { cv = (await (await fetch(`https://itunes.apple.com/search?term=${clean}&media=music&entity=song&limit=1`)).json()).results[0]?.artworkUrl100.replace('100x100bb', '600x600bb') || ''; } catch(e){} }
                    
                    const img = new Image(); 
                    img.onload = () => updateUI(cv, sn, an, al, true); 
                    img.onerror = () => updateUI('', sn, an, al, true); 
                    img.src = cv || 'empty';
                }
            } else { 
                if (currentStatus !== 'paused') { 
                    currentStatus = 'paused'; currentTrackUrl = ''; pTracker.active = false; 
                    updateUI('', 'O silêncio..', '', '', false);
                } 
            }
        }
        
        getNowPlaying(); setInterval(getNowPlaying, 5000); 
    </script>
</body>
</html>
