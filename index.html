<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Kraken V6</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            top: -10%; 
            left: -10%;
            width: 120%; 
            height: 120%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: background-image 0.5s ease-in-out;
        }

        .aurora-bg { background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fecfef, #ff9a9e); }
        .dark-bg { background-color: #050505; background-image: none; }

        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(20px); 
            z-index: 2;
            transition: background 1s ease;
        }

        #glass-overlay.fire-tint { background: rgba(180, 20, 50, 0.45) !important; }
        #glass-overlay.ice-tint { background: rgba(0, 100, 150, 0.45) !important; }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
        }

        .dashboard-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 25px;
            position: relative;
        }

        .cover-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5; 
            position: relative;
            width: 340px;
            height: 340px;
            justify-content: center;
        }

        /* --- HARDWARE LAYER --- */
        #hardware-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }

        /* --- NÚMEROS LIMPOS E DINÂMICOS --- */
        .hw-number {
            position: absolute;
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
            transform: translate(-50%, -50%) scale(1); 
            transition: left 0.5s ease-out, top 0.5s ease-out, color 0.5s ease, transform 0.3s ease-out, opacity 0.5s ease;
            z-index: 10;
        }

        .hw-number .unit {
            font-size: 0.65em;
            margin-left: 2px;
            opacity: 0.85;
            font-weight: 600;
        }

        #center-visual-container {
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .cover-circle { 
            width: 272px;
            height: 272px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8); 
            object-fit: cover;
            aspect-ratio: 1 / 1; 
            display: block;
        }

        .bars-container {
            width: 272px;
            height: 272px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .bar {
            width: 12px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            transform-origin: center;
            transform: scaleY(0.1); 
            transition: transform 0.5s ease;
        }

        .bar.animated { animation: bounce-opt 1s ease-in-out infinite alternate; }
        .bar.animated:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .bar.animated:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.4s; }
        .bar.animated:nth-child(3) { animation-duration: 0.5s; animation-delay: 0.2s; }
        .bar.animated:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.5s; }
        .bar.animated:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.3s; }

        @keyframes bounce-opt {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1.2); }
        }

        .title { 
            font-size: 40px;
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            letter-spacing: 1px;
            padding: 0 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease-in-out;
        }

        .title.news-mode {
            white-space: normal;
            font-size: 26px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .artist { 
            color: #ffffff;
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease-in-out;
        }

        .artist.news-mode {
            font-size: 18px;
            color: #ccc;
        }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="dark-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        
        <div class="dashboard-container">
            
            <div class="cover-wrapper">
                
                <div id="center-visual-container">
                    <div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
                </div>

                <div id="hardware-layer">
                    
                    <div id="cpu-t-num" class="hw-number" style="display: none;">
                        <span id="cpu-t">--</span><span class="unit">°C</span><span id="cpu-fire" style="font-size: 14px; margin-left: 3px;"></span>
                    </div>

                    <div id="cpu-l-num" class="hw-number" style="display: none;">
                        <span id="cpu-l">--</span><span class="unit">%</span>
                    </div>

                    <svg width="340" height="340" style="position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none;">
                        <g transform="rotate(90, 170, 170)">
                            
                            <!-- ANEL INTERNO: TEMPERATURA (Raio: 130) -->
                            <path d="M 170,300 A 130 130 0 0 1 170 40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-linecap="round"/>
                            <path d="M 170,300 A 130 130 0 0 0 170 40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-linecap="round"/>

                            <!-- ANEL DO MEIO: MÚSICA (Raio: 146) -->
                            <g id="music-bg-ring" style="display: none;">
                                <path d="M 170,316 A 146 146 0 0 1 170 24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
                                <path d="M 170,316 A 146 146 0 0 0 170 24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
                            </g>

                            <!-- ANEL EXTERNO: LOAD/USO (Raio: 162) -->
                            <path d="M 170,332 A 162 162 0 0 1 170 8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                            <path d="M 170,332 A 162 162 0 0 0 170 8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                            
                            <!-- PREENCHIMENTOS DINÂMICOS -->
                            <!-- Temp Fills (Raio 130, Dash 409) -->
                            <path id="cpu-bar-fill" d="M 170,300 A 130 130 0 0 1 170 40" fill="none" stroke="transparent" stroke-width="6" stroke-dasharray="409" stroke-dashoffset="409" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease;"/>
                            <path id="gpu-bar-fill" d="M 170,300 A 130 130 0 0 0 170 40" fill="none" stroke="transparent" stroke-width="6" stroke-dasharray="409" stroke-dashoffset="409" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease;"/>
                            
                            <!-- Music Progress (Raio 146, Dash 459) -->
                            <g id="music-progress" style="display: none;">
                                <path id="music-progress-left" d="M 170,316 A 146 146 0 0 1 170 24" fill="none" stroke="#ff9a9e" stroke-width="6" stroke-dasharray="459" stroke-dashoffset="459" stroke-linecap="round" style="transition: stroke-dashoffset 1s linear;" />
                                <path id="music-progress-right" d="M 170,316 A 146 146 0 0 0 170 24" fill="none" stroke="#ff9a9e" stroke-width="6" stroke-dasharray="459" stroke-dashoffset="459" stroke-linecap="round" style="transition: stroke-dashoffset 1s linear;" />
                            </g>

                            <!-- Load Fills (Raio 162, Dash 509) -->
                            <path id="cpu-load-fill" d="M 170,332 A 162 162 0 0 1 170 8" fill="none" stroke="transparent" stroke-width="8" stroke-dasharray="509" stroke-dashoffset="509" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease, opacity 0.5s ease;"/>
                            <path id="gpu-load-fill" d="M 170,332 A 162 162 0 0 0 170 8" fill="none" stroke="transparent" stroke-width="8" stroke-dasharray="509" stroke-dashoffset="509" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s ease, opacity 0.5s ease;"/>

                        </g>
                    </svg>

                    <div id="gpu-t-num" class="hw-number" style="display: none;">
                        <span id="gpu-t">--</span><span class="unit">°C</span><span id="gpu-fire" style="font-size: 14px; margin-left: 3px;"></span>
                    </div>

                    <div id="gpu-l-num" class="hw-number" style="display: none;">
                        <span id="gpu-l">--</span><span class="unit">%</span>
                    </div>

                </div>
            </div>
        </div>

        <div id="info-title" class="title">Loading...</div>
        <div id="info-artist" class="artist"></div>
        <div id="info-album" class="album"></div>
    </div>

    <script>
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b';
        const RSS_FEEDS = {
            'g1': { url: 'https://g1.globo.com/rss/g1/', name: 'G1' },
            'esports': { url: 'https://ge.globo.com/rss/esports/', name: 'e-Sports' },
            'tecnologia': { url: 'https://g1.globo.com/rss/g1/tecnologia/', name: 'Tecnologia' },
            'pop': { url: 'https://g1.globo.com/rss/g1/pop-arte/', name: 'Pop & Arte' }
        };
        let activeSources = Object.keys(RSS_FEEDS);
        let newsList = [];
        let currentNewsIndex = 0;
        let newsInterval = null;
        let lastNewsFetchTime = 0;
        let currentTrackUrl = ''; let currentStatus = ''; 
        let cpuTemp = '--'; let cpuLoad = '--';
        let gpuTemp = '--'; let gpuLoad = '--';

        let cpuLoadTimer = null;
        let gpuLoadTimer = null;

        const cache = {
            cpuT: null, cpuL: null, gpuT: null, gpuL: null, glassClass: null, musicOffset: null
        };
        const elHwLayer = document.getElementById('hardware-layer'); 
        const elBgLayer = document.getElementById('bg-layer');
        const elCenterVisual = document.getElementById('center-visual-container');
        const elTitle = document.getElementById('info-title');
        const elArtist = document.getElementById('info-artist');
        const elAlbum = document.getElementById('info-album');
        const elGlass = document.getElementById('glass-overlay');

        const fallbackBarsAnimatedHTML = `<div class="bars-container"><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div></div>`;
        const fallbackBarsFlatHTML = `<div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;
        let pTracker = { active: false, posSec: 0, durSec: 0 };
        let wnpConnected = false;
        let wnpState = { state: 0, title: '', artist: '', album: '', coverUrl: '', positionSec: 0, durationSec: 0 };
        
        function connectWNP() {
            let ws = new WebSocket('ws://127.0.0.1:8999');
            ws.onopen = () => wnpConnected = true;
            ws.onclose = () => { wnpConnected = false; setTimeout(connectWNP, 10000); };
            ws.onmessage = (e) => {
                const d = e.data;
                if (d.startsWith('STATE:')) wnpState.state = parseInt(d.substring(6));
                else if (d.startsWith('TITLE:')) wnpState.title = d.substring(6);
                else if (d.startsWith('ARTIST:')) wnpState.artist = d.substring(7);
                else if (d.startsWith('ALBUM:')) wnpState.album = d.substring(6);
                else if (d.startsWith('COVER:')) wnpState.coverUrl = d.substring(6);
                else if (d.startsWith('POSITION:')) {
                    let p = d.substring(9).split(':');
                    wnpState.positionSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
                else if (d.startsWith('DURATION:')) {
                    let p = d.substring(9).split(':');
                    wnpState.durationSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
            };
        }
        connectWNP();

        // Sistema universal de Cores para Temp e Load
        function getProgressColor(value) {
            if (value === '--') return 'transparent';
            if (value <= 40) return '#00d2ff'; 
            if (value <= 65) return '#a8e063'; 
            if (value <= 80) return '#f6d365'; 
            return '#ff416c';
        }

        // Função responsável por atualizar as barras e mover/aumentar os números
        function updateTrackPosition(pathId, elementId, value, targetRadius, pathRadius) {
            const path = document.getElementById(pathId);
            const element = document.getElementById(elementId);
            if (!path || !element || value === '--') return;

            const totalLength = path.getTotalLength();
            const numericValue = Math.min(value, 100);
            const currentLength = (numericValue / 100) * totalLength;
            
            // Atualiza o progresso visual da linha do SVG
            path.style.strokeDasharray = totalLength;
            path.style.strokeDashoffset = totalLength - currentLength;

            // Encontra a coordenada X,Y atual da ponta da linha preenchida
            const pt = path.getPointAtLength(currentLength);
            
            const cx = 170;
            const cy = 170;
            const vx = pt.x - cx;
            const vy = pt.y - cy;
            
            // Ajusta a distância do texto para o centro baseado no "targetRadius"
            const scaleFactor = targetRadius / pathRadius;
            const outerX = cx + vx * scaleFactor;
            const outerY = cy + vy * scaleFactor;
            
            // Compensação pela rotação de 90 graus no container `<g>` do SVG
            const finalX = cx - (outerY - cy);
            const finalY = cy + (outerX - cx);
            
            element.style.left = `${finalX}px`;
            element.style.top = `${finalY}px`;

            // Lógica de Escala Dinâmica do Texto: Aumenta até 1.8x baseado no percentual (0 a 100)
            const dynamicScale = 1 + (numericValue / 100) * 0.8;
            element.style.transform = `translate(-50%, -50%) scale(${dynamicScale})`;
        }

        window.nzxt = {
            v1: {
                onMonitoringDataUpdate: (data) => {
                    const { cpus, gpus } = data;
                    
                    if (cpus?.length > 0) { 
                        cpuTemp = Math.round(cpus[0].temperature);
                        let cLoad = cpus[0].load !== undefined ? cpus[0].load : 0;
                        cpuLoad = Math.round(cLoad <= 1 && cLoad > 0 ? cLoad * 100 : cLoad);
                    }
                    
                    if (gpus?.length > 0) { 
                        let targetGpu = gpus.length > 1 ? gpus[1] : gpus[0];
                        gpuTemp = Math.round(targetGpu.temperature);
                        let gLoad = targetGpu.load !== undefined ? targetGpu.load : (targetGpu.usage !== undefined ? targetGpu.usage : 0);
                        gpuLoad = Math.round(gLoad <= 1 && gLoad > 0 ? gLoad * 100 : gLoad);
                    }
                    
                    let mx = Math.max(cpuTemp !== '--' ? cpuTemp : 0, gpuTemp !== '--' ? gpuTemp : 0);
                    let newGlassClass = cache.glassClass || '';
                    
                    if (newGlassClass === 'fire-tint') {
                        if (mx < 60) newGlassClass = '';
                    } else if (newGlassClass === 'ice-tint') {
                        if (mx > 40) newGlassClass = '';
                    } else {
                        if (mx >= 68) newGlassClass = 'fire-tint';
                        else if (mx <= 35 && mx > 0) newGlassClass = 'ice-tint';
                    }
                    
                    if (cache.glassClass !== newGlassClass) {
                        elGlass.className = newGlassClass;
                        cache.glassClass = newGlassClass;
                    }

                    // --- ATUALIZANDO CPU TEMP ---
                    if (cache.cpuT !== cpuTemp) {
                        const elCpuT = document.getElementById('cpu-t-num');
                        if (cpuTemp !== '--') { 
                            let color = getProgressColor(cpuTemp);
                            document.getElementById('cpu-bar-fill').style.stroke = color; 
                            elCpuT.style.color = color;
                            elCpuT.style.display = 'flex';
                            document.getElementById('cpu-t').innerText = cpuTemp;
                            document.getElementById('cpu-fire').innerText = cpuTemp > 50 ? '🔥' : '';
                            
                            // Temp agora é o anel interno (Raio 130). O texto flutua por fora de todas as barras (Raio 196) para evitar sobreposição
                            updateTrackPosition('cpu-bar-fill', 'cpu-t-num', cpuTemp, 196, 130); 
                        } else {
                            elCpuT.style.display = 'none';
                        }
                        cache.cpuT = cpuTemp;
                    }

                    // --- ATUALIZANDO CPU LOAD ---
                    if (cache.cpuL !== cpuLoad) {
                        const elCpuL = document.getElementById('cpu-l-num');
                        const pathCpuL = document.getElementById('cpu-load-fill');
                        if (cpuLoad !== '--') {
                            let color = getProgressColor(cpuLoad);
                            pathCpuL.style.stroke = color; 
                            elCpuL.style.color = color;
                            elCpuL.style.display = 'flex';
                            document.getElementById('cpu-l').innerText = cpuLoad;
                            
                            // Load agora é o anel externo (Raio 162). Texto acompanha com folga simétrica (Raio 180)
                            updateTrackPosition('cpu-load-fill', 'cpu-l-num', cpuLoad, 180, 162); 

                            // Lógica 25% por 5 segundos
                            if (cpuLoad < 25) {
                                if (!cpuLoadTimer) {
                                    cpuLoadTimer = setTimeout(() => {
                                        elCpuL.style.opacity = '0';
                                        pathCpuL.style.opacity = '0';
                                    }, 5000);
                                }
                            } else {
                                if (cpuLoadTimer) {
                                    clearTimeout(cpuLoadTimer);
                                    cpuLoadTimer = null;
                                }
                                elCpuL.style.opacity = '1';
                                pathCpuL.style.opacity = '1';
                            }
                        } else {
                            elCpuL.style.display = 'none';
                        }
                        cache.cpuL = cpuLoad;
                    }

                    // --- ATUALIZANDO GPU TEMP ---
                    if (cache.gpuT !== gpuTemp) {
                        const elGpuT = document.getElementById('gpu-t-num');
                        if (gpuTemp !== '--') { 
                            let color = getProgressColor(gpuTemp);
                            document.getElementById('gpu-bar-fill').style.stroke = color; 
                            elGpuT.style.color = color;
                            elGpuT.style.display = 'flex';
                            document.getElementById('gpu-t').innerText = gpuTemp;
                            document.getElementById('gpu-fire').innerText = gpuTemp > 50 ? '🔥' : '';
                            
                            // Temp agora é o anel interno (Raio 130). O texto flutua por fora (Raio 196)
                            updateTrackPosition('gpu-bar-fill', 'gpu-t-num', gpuTemp, 196, 130); 
                        } else {
                            elGpuT.style.display = 'none';
                        }
                        cache.gpuT = gpuTemp;
                    }

                    // --- ATUALIZANDO GPU LOAD ---
                    if (cache.gpuL !== gpuLoad) {
                        const elGpuL = document.getElementById('gpu-l-num');
                        const pathGpuL = document.getElementById('gpu-load-fill');
                        if (gpuLoad !== '--') {
                            let color = getProgressColor(gpuLoad);
                            pathGpuL.style.stroke = color; 
                            elGpuL.style.color = color;
                            elGpuL.style.display = 'flex';
                            document.getElementById('gpu-l').innerText = gpuLoad;
                            
                            // Load agora é o anel externo (Raio 162). Texto acompanha (Raio 180)
                            updateTrackPosition('gpu-load-fill', 'gpu-l-num', gpuLoad, 180, 162); 

                            // Lógica 25% por 5 segundos
                            if (gpuLoad < 25) {
                                if (!gpuLoadTimer) {
                                    gpuLoadTimer = setTimeout(() => {
                                        elGpuL.style.opacity = '0';
                                        pathGpuL.style.opacity = '0';
                                    }, 5000);
                                }
                            } else {
                                if (gpuLoadTimer) {
                                    clearTimeout(gpuLoadTimer);
                                    gpuLoadTimer = null;
                                }
                                elGpuL.style.opacity = '1';
                                pathGpuL.style.opacity = '1';
                            }
                        } else {
                            elGpuL.style.display = 'none';
                        }
                        cache.gpuL = gpuLoad;
                    }
                }
            }
        };
        
        function preloadImageAndUpdate(imageUrl, updateCallback) {
            const fadeDuration = 500;
            const startTime = Date.now();
            const triggerUpdate = () => {
                const elapsed = Date.now() - startTime;
                const remainingDelay = Math.max(0, fadeDuration - elapsed);
                setTimeout(updateCallback, remainingDelay);
            };
            if (imageUrl) {
                const img = new Image();
                img.onload = triggerUpdate;
                img.onerror = triggerUpdate; 
                img.src = imageUrl;
            } else {
                triggerUpdate();
            }
        }

        async function fetchNews() {
            const now = Date.now();
            if (now - lastNewsFetchTime < 120000) return; 
            lastNewsFetchTime = now;
            try {
                newsList = [];
                for (let k of activeSources) {
                    let response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${RSS_FEEDS[k].url}`);
                    let data = await response.json();
                    if (data.items) {
                        data.items.forEach(item => {
                            let imgUrl = item.enclosure?.link || item.thumbnail || (item.description.match(/<img[^>]+src="([^">]+)"/) || [])[1] || '';
                            if (imgUrl) newsList.push({ title: item.title, source: RSS_FEEDS[k].name, image: imgUrl });
                        });
                    }
                }
                newsList.sort(() => Math.random() - 0.5);
            } catch (error) { }
        }

        function showSilenceState() {
            elTitle.className = 'title'; elArtist.className = 'artist'; elAlbum.style.display = 'none';
            elTitle.innerText = 'Só silencio...'; elArtist.innerText = '';
            elBgLayer.style.backgroundImage = 'none'; 
            elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg'; 
            elCenterVisual.innerHTML = fallbackBarsFlatHTML;
            elHwLayer.style.opacity = 0; 
        }

        function showNextNews() {
            if (currentNewsIndex >= newsList.length) {
                stopNewsCycle();
                elCenterVisual.style.opacity = 0;
                elCenterVisual.style.transform = 'translate(-50%, -50%) scale(0.95)';
                elTitle.style.opacity = 0;
                elArtist.style.opacity = 0;
                elAlbum.style.opacity = 0;

                setTimeout(() => {
                    showSilenceState();
                    elCenterVisual.style.opacity = 1;
                    elCenterVisual.style.transform = 'translate(-50%, -50%) scale(1)';
                    elTitle.style.opacity = 1;
                    elArtist.style.opacity = 1;
                    elAlbum.style.opacity = 1;
                }, 500);
                return;
            }

            const newsItem = newsList[currentNewsIndex];
            
            elBgLayer.style.backgroundImage = 'none';
            elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg';
            
            if (newsItem.image) {
                elCenterVisual.innerHTML = `<img class="cover-circle" src="${newsItem.image}">`;
            } else {
                elCenterVisual.innerHTML = fallbackBarsFlatHTML;
            }

            elTitle.className = 'title news-mode';
            elArtist.className = 'artist news-mode';
            elAlbum.style.display = 'none';

            elTitle.innerText = newsItem.title;
            elArtist.innerText = newsItem.source;

            currentNewsIndex++;
        }

        function startNewsCycle() {
            if (newsInterval) return;
            fetchNews().then(() => {
                if(newsList.length > 0) {
                    currentNewsIndex = 0;
                    showNextNews();
                    newsInterval = setInterval(showNextNews, 15000); 
                } else {
                    showSilenceState();
                }
            });
        }

        function stopNewsCycle() {
            if (newsInterval) { clearInterval(newsInterval);
            newsInterval = null; }
        }

        setInterval(() => {
            const bgRing = document.getElementById('music-bg-ring');
            const progRing = document.getElementById('music-progress');
            const progLeft = document.getElementById('music-progress-left');
            const progRight = document.getElementById('music-progress-right');

            if (pTracker.active && pTracker.durSec > 0) {
                bgRing.style.display = 'block'; 
                progRing.style.display = 'block'; 
                
                pTracker.posSec = Math.min(pTracker.posSec + 1, pTracker.durSec);
                
                // Novo cálculo para a barra de música (Raio 146 -> Total Dash = 459)
                let o = 459 - (459 * (pTracker.posSec / pTracker.durSec)); 
                
                if (cache.musicOffset !== o) {
                    progLeft.style.strokeDashoffset = o; 
                    progRight.style.strokeDashoffset = o; 
                    cache.musicOffset = o;
                }
            } else { 
                bgRing.style.display = 'none';
                progRing.style.display = 'none'; 
                cache.musicOffset = null; 
            }
        }, 1000);
        
        function cleanStringForSearch(str) {
            if (!str) return '';
            return str.replace(/\(.*?\)/g, ' ').replace(/\[.*?\]/g, ' ').replace(/[-_]/g, ' ')
                .replace(/(ft\.|feat\.|prod\.|remix|official|video|audio|lyrics).*$/i, ' ')
                .replace(/[^a-zA-Z0-9À-ÿ\s]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        async function fetchItunesCover(query) {
            if (!query) return '';
            try {
                let res = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=5`);
                let data = await res.json();
                if (data.results && data.results.length > 0) {
                    let maxIdx = Math.min(data.results.length, 3);
                    let randomIdx = Math.floor(Math.random() * maxIdx);
                    return data.results[randomIdx].artworkUrl100.replace('100x100bb', '600x600bb');
                }
            } catch (e) { }
            return '';
        }

        async function getNowPlaying() {
            let isP = false;
            let sn = ''; let an = ''; let al = ''; let dc = ''; let hasP = false;
            let tp = 0; let td = 0;
            
            if (wnpConnected && wnpState.state === 1) { 
                isP = true;
                sn = wnpState.title; an = wnpState.artist; al = wnpState.album; dc = wnpState.coverUrl; 
                if (wnpState.durationSec > 0) { hasP = true;
                tp = wnpState.positionSec; td = wnpState.durationSec; } 
            }
            
            if (!isP) {
                try {
                    const mpcRes = await fetch('http://localhost:13579/variables.html');
                    const text = await mpcRes.text();
                    const doc = new DOMParser().parseFromString(text, "text/html");
                    if (doc.getElementById('state')?.innerText === '2') { 
                        isP = true;
                        let cleanName = (doc.getElementById('file')?.innerText || '').replace(/\.[^/.]+$/, ""); 
                        an = "Desconhecido"; sn = cleanName;
                        if (cleanName.includes(" - ")) {
                            const parts = cleanName.split(" - ");
                            an = parts[0].trim(); sn = parts.slice(1).join(" - ").trim();
                        }
                        const posStr = doc.getElementById('positionstring')?.innerText;
                        const durStr = doc.getElementById('durationstring')?.innerText;
                        if (durStr && durStr !== '00:00:00') { 
                            hasP = true;
                            const parseTime = (s) => {
                                if (!s) return 0;
                                let p = s.split(':');
                                return p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : (p.length === 3 ? parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]) : 0);
                            };
                            tp = parseTime(posStr); td = parseTime(durStr); 
                        }
                    }
                } catch (e) {}
            }

            if (!isP) {
                try {
                    const lfm = await (await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`)).json();
                    const tr = lfm.recenttracks.track[0];
                    if (tr && tr['@attr'] && tr['@attr'].nowplaying) {
                        isP = true; sn = tr.name; an = tr.artist['#text']; al = tr.album['#text']; dc = tr.image[tr.image.length - 1]['#text'];
                    }
                } catch(e){}
            }

            let status = `${sn}-${an}`;
            
            if (!isP) {
                if (currentStatus !== 'NOT_PLAYING') {
                    currentStatus = 'NOT_PLAYING';
                    pTracker.active = false;
                    startNewsCycle();
                }
                return;
            }

            stopNewsCycle();
            
            if (hasP) { pTracker.active = true; pTracker.posSec = tp; pTracker.durSec = td; } 
            else { pTracker.active = false; }
            
            elHwLayer.style.opacity = 1;

            if (currentStatus !== status) {
                currentStatus = status;
                elCenterVisual.style.opacity = 0;
                elCenterVisual.style.transform = 'translate(-50%, -50%) scale(0.95)';
                elTitle.style.opacity = 0;
                elArtist.style.opacity = 0;
                elAlbum.style.opacity = 0;

                let coverUrl = dc;
                if (!coverUrl || coverUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                    let q = cleanStringForSearch(`${sn} ${an}`);
                    coverUrl = await fetchItunesCover(q);
                }

                preloadImageAndUpdate(coverUrl, () => {
                    if (coverUrl) {
                        elBgLayer.style.backgroundImage = `url('${coverUrl}')`;
                        elBgLayer.className = '';
                        elCenterVisual.innerHTML = `<img class="cover-circle" src="${coverUrl}">`;
                    } else {
                        elBgLayer.style.backgroundImage = 'none';
                        elBgLayer.className = 'dark-bg';
                        elCenterVisual.innerHTML = fallbackBarsAnimatedHTML;
                    }

                    elTitle.className = 'title'; elArtist.className = 'artist'; elAlbum.style.display = 'block';
                    elTitle.innerText = sn || 'Desconhecido';
                    elArtist.innerText = an || 'Desconhecido';
                    elAlbum.innerText = al || '';
                    
                    elCenterVisual.style.opacity = 1;
                    elCenterVisual.style.transform = 'translate(-50%, -50%) scale(1)';
                    elTitle.style.opacity = 1;
                    elArtist.style.opacity = 1;
                    elAlbum.style.opacity = 1;
                });
            }
        }

        setInterval(getNowPlaying, 3000);
        getNowPlaying();
    </script>
</body>
