<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Híbrido Kraken Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            top: -10%; 
            left: -10%;
            width: 120%; 
            height: 120%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: all 1s ease-in-out;
        }

        /* Fundo Diurno */
        .aurora-bg {
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fecfef, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Fundo Noturno */
        .dark-bg {
            background-color: #050505;
            background-image: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); 
            backdrop-filter: blur(25px);
            z-index: 2;
        }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
            transition: opacity 0.5s ease-in-out;
        }

        /* --- CLIMA NO TOPO --- */
        .weather-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 8px 26px; 
            font-size: 30px; 
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px; 
            margin-bottom: 20px; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        /* --- DASHBOARD COM BARRAS DUPLAS E ICONE GIGANTE --- */
        .dashboard-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px; 
            width: 100%;
            margin-bottom: 25px;
        }

        .hw-side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px; /* Espaçamento mais compacto para alinhar bem */
            z-index: 5;
            width: 120px; /* FIXED WIDTH: Impede o layout de tremer/mexer */
        }

        .hw-big-icon {
            font-size: 42px; /* Ícone gigante no topo */
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 2px;
        }

        .hw-bars-row {
            display: flex;
            gap: 18px; 
            justify-content: center;
        }

        .hw-bar-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 50px; /* Largura fixa para cada conjunto de barra + número */
        }

        .hw-bar-track {
            width: 14px; 
            height: 150px; 
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            overflow: hidden; 
        }

        .hw-bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 20px;
            transition: height 0.5s ease-in-out, background 0.5s ease, box-shadow 0.5s ease;
        }

        .hw-bar-value {
            font-size: 26px; 
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            font-variant-numeric: tabular-nums; /* SOLUÇÃO DO TREMOR: Trava a largura dos números */
            margin-top: 4px;
            display: flex;
            align-items: baseline;
        }
        
        .hw-bar-unit {
            font-size: 16px; 
            font-weight: 600;
            color: #ddd;
            margin-left: 2px;
        }

        .hw-bar-label {
            font-size: 20px; /* Rótulo CPU/GPU agora na base, maior */
            font-weight: 900;
            color: #c2e9fb;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            margin-top: 6px;
        }

        .cover-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5; 
            position: relative;
        }

        .cover-circle { 
            width: 270px; 
            height: 270px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.4); 
            object-fit: cover;
            display: block;
        }

        .bars-container {
            width: 270px;
            height: 270px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .bar {
            width: 12px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            animation: bounce 1s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.4s; }
        .bar:nth-child(3) { animation-duration: 0.5s; animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.5s; }
        .bar:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 30px; transform: scaleY(1); }
            100% { height: 140px; transform: scaleY(1.1); }
        }

        .title { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 3px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }

        .artist { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        
        .source-badge {
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 12px;
            margin-top: 10px;
            color: #aaa;
        }

        /* --- ESTILOS DO MENU DE CONTEXTO --- */
        #context-menu {
            display: none;
            position: absolute;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            min-width: 250px;
            max-height: 80vh;
            overflow-y: auto;
        }

        #context-menu::-webkit-scrollbar {
            width: 6px;
        }
        #context-menu::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        #context-menu h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }

        .menu-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #ddd;
            transition: color 0.2s;
        }
        
        .menu-option:hover {
            color: #fff;
        }

        .menu-option input[type="checkbox"] {
            margin-right: 10px;
            accent-color: #ff9a9e;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        #save-menu-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: linear-gradient(90deg, #a1c4fd, #c2e9fb);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #save-menu-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="aurora-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        <p style="font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Inicializando Sistema Híbrido...</p>
    </div>

    <div id="context-menu">
        <h3>Fontes de Notícias</h3>
        <label class="menu-option"><input type="checkbox" value="g1" class="news-source-cb"> G1 (Geral)</label>
        <label class="menu-option"><input type="checkbox" value="copa" class="news-source-cb"> Copa do Mundo</label>
        <label class="menu-option"><input type="checkbox" value="ge" class="news-source-cb"> Esportes (GE)</label>
        <label class="menu-option"><input type="checkbox" value="esports" class="news-source-cb"> e-Sports & Games</label>
        <label class="menu-option"><input type="checkbox" value="pop" class="news-source-cb"> Pop & Arte (Filmes/Séries)</label>
        <label class="menu-option"><input type="checkbox" value="tecnologia" class="news-source-cb"> Tecnologia</label>
        <label class="menu-option"><input type="checkbox" value="carros" class="news-source-cb"> Carros & Auto</label>
        <label class="menu-option"><input type="checkbox" value="economia" class="news-source-cb"> Economia</label>
        <label class="menu-option"><input type="checkbox" value="politica" class="news-source-cb"> Política</label>
        <button id="save-menu-btn">Salvar & Atualizar</button>
    </div>

    <script>
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 

        const RSS_FEEDS = {
            'g1': { url: 'https://g1.globo.com/rss/g1/', name: 'G1' },
            'copa': { url: 'https://ge.globo.com/rss/futebol/copa-do-mundo/', name: 'Copa do Mundo' },
            'ge': { url: 'https://ge.globo.com/rss/ge/', name: 'GE Esportes' },
            'esports': { url: 'https://ge.globo.com/rss/esports/', name: 'e-Sports' },
            'pop': { url: 'https://g1.globo.com/rss/g1/pop-arte/', name: 'Pop & Arte' },
            'tecnologia': { url: 'https://g1.globo.com/rss/g1/tecnologia/', name: 'Tecnologia' },
            'carros': { url: 'https://g1.globo.com/rss/g1/carros/', name: 'AutoEsporte' },
            'economia': { url: 'https://g1.globo.com/rss/g1/economia/', name: 'Economia' },
            'politica': { url: 'https://g1.globo.com/rss/g1/politica/', name: 'Política' }
        };

        let activeSources = JSON.parse(localStorage.getItem('kraken_news_all_v2')) || Object.keys(RSS_FEEDS);

        let currentTrackUrl = '';
        let currentStatus = ''; 
        
        let newsInterval = null; 
        let newsList = [];
        let currentNewsIndex = 0; 
        let goianiaWeather = null;

        let cpuTemp = '--';
        let cpuLoad = '--';
        let gpuTemp = '--';
        let gpuLoad = '--';

        function getStatusIcon(temp) {
            if (temp === '--') return '';
            if (temp <= 30) return '🧊';
            if (temp <= 35) return '❄️';
            if (temp <= 39) return '🥶';
            if (temp <= 50) return '✔️';
            if (temp <= 55) return '🥵';
            if (temp <= 69) return '🔥';
            if (temp <= 80) return '🌋';
            return '⚡';
        }

        function getBarColor(temp) {
            if (temp === '--') return 'transparent';
            if (temp <= 39) return '#00d2ff'; // Gelo / Azul
            if (temp <= 50) return '#a8e063'; // Verde Saudável
            if (temp <= 55) return '#f6d365'; // Amarelo
            if (temp <= 69) return '#fc4a1a'; // Laranja / Quente
            return '#ff416c'; // Vermelho / Fogo
        }

        function getLoadColor(load) {
            if (load === '--') return 'transparent';
            if (load <= 40) return '#00d2ff'; // Uso leve
            if (load <= 65) return '#a8e063'; // Uso médio
            if (load <= 85) return '#f6d365'; // Uso alto
            return '#ff416c'; // Uso extremo
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️'; 
            if (code === 1 || code === 2) return '⛅'; 
            if (code === 3) return '☁️'; 
            if (code >= 45 && code <= 48) return '🌫️'; 
            if (code >= 51 && code <= 67) return '🌧️'; 
            if (code >= 71 && code <= 77) return '❄️'; 
            if (code >= 80 && code <= 82) return '🌦️'; 
            if (code >= 95) return '⛈️'; 
            return '☀️';
        }

        window.nzxt = {
            v1: {
                onMonitoringDataUpdate: (data) => {
                    const { cpus, gpus } = data;
                    if (cpus && cpus.length > 0) {
                        cpuTemp = Math.round(cpus[0].temperature);
                        let load = cpus[0].load;
                        cpuLoad = Math.round(load <= 1 ? load * 100 : load);
                    }
                    if (gpus && gpus.length > 0) {
                        let gpuIndex = gpus.length > 1 ? 1 : 0;
                        gpuTemp = Math.round(gpus[gpuIndex].temperature);
                        let load = gpus[gpuIndex].load;
                        gpuLoad = Math.round(load <= 1 ? load * 100 : load);
                    }
                    
                    // Atualiza Textos
                    const elCpuT = document.getElementById('cpu-t');
                    if (elCpuT) elCpuT.innerText = cpuTemp;
                    const elCpuI = document.getElementById('cpu-icon'); // Ícone gigante
                    if (elCpuI) elCpuI.innerText = getStatusIcon(cpuTemp);
                    const elCpuL = document.getElementById('cpu-l');
                    if (elCpuL) elCpuL.innerText = cpuLoad;

                    const elGpuT = document.getElementById('gpu-t');
                    if (elGpuT) elGpuT.innerText = gpuTemp;
                    const elGpuI = document.getElementById('gpu-icon'); // Ícone gigante
                    if (elGpuI) elGpuI.innerText = getStatusIcon(gpuTemp);
                    const elGpuL = document.getElementById('gpu-l');
                    if (elGpuL) elGpuL.innerText = gpuLoad;

                    // Atualiza Barras CPU
                    const elCpuBar = document.getElementById('cpu-bar-fill');
                    if (elCpuBar && cpuTemp !== '--') {
                        let pct = Math.min(Math.max(cpuTemp, 0), 100);
                        elCpuBar.style.height = pct + '%';
                        elCpuBar.style.background = getBarColor(cpuTemp);
                        elCpuBar.style.boxShadow = `0 0 10px ${getBarColor(cpuTemp)}`;
                    }
                    const elCpuLoadBar = document.getElementById('cpu-load-fill');
                    if (elCpuLoadBar && cpuLoad !== '--') {
                        let pctL = Math.min(Math.max(cpuLoad, 0), 100);
                        elCpuLoadBar.style.height = pctL + '%';
                        elCpuLoadBar.style.background = getLoadColor(cpuLoad);
                        elCpuLoadBar.style.boxShadow = `0 0 10px ${getLoadColor(cpuLoad)}`;
                    }

                    // Atualiza Barras GPU
                    const elGpuBar = document.getElementById('gpu-bar-fill');
                    if (elGpuBar && gpuTemp !== '--') {
                        let pct = Math.min(Math.max(gpuTemp, 0), 100);
                        elGpuBar.style.height = pct + '%';
                        elGpuBar.style.background = getBarColor(gpuTemp);
                        elGpuBar.style.boxShadow = `0 0 10px ${getBarColor(gpuTemp)}`;
                    }
                    const elGpuLoadBar = document.getElementById('gpu-load-fill');
                    if (elGpuLoadBar && gpuLoad !== '--') {
                        let pctL = Math.min(Math.max(gpuLoad, 0), 100);
                        elGpuLoadBar.style.height = pctL + '%';
                        elGpuLoadBar.style.background = getLoadColor(gpuLoad);
                        elGpuLoadBar.style.boxShadow = `0 0 10px ${getLoadColor(gpuLoad)}`;
                    }
                }
            }
        };

        const fallbackHTML = `
            <div class="bars-container">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        `;

        function getBackgroundClass() {
            const hour = new Date().getHours();
            if (hour >= 18 || hour < 6) return 'dark-bg';
            return 'aurora-bg';
        }

        const contextMenu = document.getElementById('context-menu');
        const checkboxes = document.querySelectorAll('.news-source-cb');

        function syncCheckboxes() {
            checkboxes.forEach(cb => { cb.checked = activeSources.includes(cb.value); });
        }
        syncCheckboxes();

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault(); 
            contextMenu.style.display = 'block';
            let x = e.pageX; let y = e.pageY;
            if (x + contextMenu.offsetWidth > window.innerWidth) x = window.innerWidth - contextMenu.offsetWidth - 10;
            if (y + contextMenu.offsetHeight > window.innerHeight) y = window.innerHeight - contextMenu.offsetHeight - 10;
            contextMenu.style.left = `${x}px`; contextMenu.style.top = `${y}px`;
        });

        window.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) contextMenu.style.display = 'none';
        });

        document.getElementById('save-menu-btn').addEventListener('click', () => {
            const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            if (selected.length === 0) {
                alert("Selecione pelo menos uma fonte de notícias!");
                return;
            }
            activeSources = selected;
            localStorage.setItem('kraken_news_all_v2', JSON.stringify(activeSources));
            contextMenu.style.display = 'none';
            fetchNews(); 
        });

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-16.6799&longitude=-49.2562&current_weather=true');
                const data = await res.json();
                if (data.current_weather) goianiaWeather = data.current_weather;
            } catch (e) { console.error("Erro ao buscar clima", e); }
        }

        async function fetchNews() {
            try {
                await fetchWeather();
                newsList = [];
                const fetchPromises = activeSources.map(async (sourceKey) => {
                    const sourceData = RSS_FEEDS[sourceKey];
                    if (!sourceData) return;

                    const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${sourceData.url}`);
                    const data = await response.json();
                    
                    if (data.items && data.items.length > 0) {
                        data.items.forEach(item => {
                            let imgUrl = '';
                            if (item.enclosure && item.enclosure.link) imgUrl = item.enclosure.link;
                            else if (item.thumbnail) imgUrl = item.thumbnail;
                            else {
                                const match = item.description.match(/<img[^>]+src="([^">]+)"/);
                                if (match) imgUrl = match[1];
                            }

                            if (imgUrl) {
                                newsList.push({ title: item.title, source: sourceData.name, image: imgUrl });
                            }
                        });
                    }
                });

                await Promise.all(fetchPromises);
                newsList = newsList.sort(() => Math.random() - 0.5);
                currentNewsIndex = 0; 

            } catch (error) { console.error("Erro ao buscar notícias:", error); }
        }

        fetchNews();

        function startNewsCycle() {
            if (newsInterval) return;
            const widget = document.getElementById('music-widget');
            
            const updateNews = () => {
                if (newsList.length === 0) return;

                const bgLayer = document.getElementById('bg-layer');
                widget.style.opacity = 0; 
                
                setTimeout(() => {
                    let visualHTML = '';
                    let weatherHTML = '';

                    if (goianiaWeather) {
                        const wIcon = getWeatherIcon(goianiaWeather.weathercode);
                        const wTemp = Math.round(goianiaWeather.temperature);
                        weatherHTML = `
                            <div class="weather-overlay">
                                ${wTemp}°C ${wIcon}
                            </div>
                        `;
                    }
                    
                    const newsItem = newsList[currentNewsIndex];
                    if (newsItem.image) {
                        bgLayer.className = ''; 
                        bgLayer.style.backgroundImage = `url('${newsItem.image}')`;
                        visualHTML = `<img class="cover-circle" src="${newsItem.image}" alt="Capa Notícia">`;
                    } else {
                        bgLayer.style.backgroundImage = 'none';
                        bgLayer.className = getBackgroundClass(); 
                        visualHTML = fallbackHTML;
                    }

                    let initialCpuIcon = getStatusIcon(cpuTemp);
                    let initialGpuIcon = getStatusIcon(gpuTemp);

                    let cpuColor = getBarColor(cpuTemp);
                    let gpuColor = getBarColor(gpuTemp);
                    let cpuLoadColor = getLoadColor(cpuLoad);
                    let gpuLoadColor = getLoadColor(gpuLoad);

                    let initCpuHeight = cpuTemp !== '--' ? Math.min(Math.max(cpuTemp, 0), 100) + '%' : '0%';
                    let initGpuHeight = gpuTemp !== '--' ? Math.min(Math.max(gpuTemp, 0), 100) + '%' : '0%';
                    let initCpuLoadHeight = cpuLoad !== '--' ? Math.min(Math.max(cpuLoad, 0), 100) + '%' : '0%';
                    let initGpuLoadHeight = gpuLoad !== '--' ? Math.min(Math.max(gpuLoad, 0), 100) + '%' : '0%';

                    let dashboardHTML = `
                        <div class="dashboard-container">
                            <div class="hw-side-panel">
                                <div class="hw-big-icon" id="cpu-icon">${initialCpuIcon}</div>
                                <div class="hw-bars-row">
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="cpu-bar-fill" style="height: ${initCpuHeight}; background: ${cpuColor}; box-shadow: 0 0 10px ${cpuColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="cpu-t">${cpuTemp}</span><span class="hw-bar-unit">°</span></div>
                                    </div>
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="cpu-load-fill" style="height: ${initCpuLoadHeight}; background: ${cpuLoadColor}; box-shadow: 0 0 10px ${cpuLoadColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="cpu-l">${cpuLoad}</span><span class="hw-bar-unit">%</span></div>
                                    </div>
                                </div>
                                <div class="hw-bar-label">CPU</div>
                            </div>
                            
                            <div class="cover-wrapper">
                                ${visualHTML}
                            </div>
                            
                            <div class="hw-side-panel">
                                <div class="hw-big-icon" id="gpu-icon">${initialGpuIcon}</div>
                                <div class="hw-bars-row">
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="gpu-bar-fill" style="height: ${initGpuHeight}; background: ${gpuColor}; box-shadow: 0 0 10px ${gpuColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="gpu-t">${gpuTemp}</span><span class="hw-bar-unit">°</span></div>
                                    </div>
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="gpu-load-fill" style="height: ${initGpuLoadHeight}; background: ${gpuLoadColor}; box-shadow: 0 0 10px ${gpuLoadColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="gpu-l">${gpuLoad}</span><span class="hw-bar-unit">%</span></div>
                                    </div>
                                </div>
                                <div class="hw-bar-label">GPU</div>
                            </div>
                        </div>
                    `;

                    widget.innerHTML = `
                        ${weatherHTML}
                        ${dashboardHTML}
                        <div class="title" style="white-space: normal; font-size: 26px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; margin-bottom: 12px; padding: 0 15px;">${newsItem.title}</div>
                        <div class="artist" style="font-size: 18px; color: #ccc;">${newsItem.source}</div>
                    `;
                    
                    currentNewsIndex++;
                    if (currentNewsIndex >= newsList.length) currentNewsIndex = 0; 
                    
                    widget.style.opacity = 1; 
                }, 500);
            };
            
            updateNews(); 
            newsInterval = setInterval(updateNews, 10000); 
        }

        function stopNewsCycle() {
            if (newsInterval) { clearInterval(newsInterval); newsInterval = null; }
        }

        function cleanStringForSearch(str) {
            if (!str) return '';
            return str.replace(/\(.*?\)/g, ' ').replace(/\[.*?\]/g, ' ').replace(/[-_]/g, ' ')
                .replace(/(ft\.|feat\.|prod\.|remix|official|video|audio|lyrics).*$/i, ' ')
                .replace(/[^a-zA-Z0-9À-ÿ\s]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        async function fetchItunesCover(artist, song) {
            try {
                const cleanArtist = cleanStringForSearch(artist).normalize('NFKC');
                const cleanSong = cleanStringForSearch(song).normalize('NFKC');

                let query = encodeURIComponent(`${cleanArtist} ${cleanSong}`);
                let itunesRes = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=1`);
                let itunesData = await itunesRes.json();
                
                if (itunesData.results && itunesData.results.length > 0) {
                    return itunesData.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                }

                if (cleanSong.length > 0) {
                    query = encodeURIComponent(cleanSong);
                    itunesRes = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&entity=song&limit=1`);
                    itunesData = await itunesRes.json();

                    if (itunesData.results && itunesData.results.length > 0) {
                        return itunesData.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                    }
                }
            } catch (e) { }
            return '';
        }

        async function getNowPlaying() {
            let isPlaying = false;
            let songName = '';
            let artistName = '';
            let albumName = '';
            let coverUrl = '';
            let activeSource = '';

            try {
                const mpcRes = await fetch('http://localhost:13579/variables.html');
                const text = await mpcRes.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, "text/html");
                const state = doc.getElementById('state')?.innerText || '0';
                
                if (state === '2') { 
                    isPlaying = true;
                    activeSource = 'MPC-HC';
                    const rawFile = doc.getElementById('file')?.innerText || '';
                    let cleanName = rawFile.replace(/\.[^/.]+$/, ""); 
                    
                    artistName = "Desconhecido"; songName = cleanName;

                    if (cleanName.includes(" - ")) {
                        const parts = cleanName.split(" - ");
                        artistName = parts[0].trim(); songName = parts.slice(1).join(" - ").trim();
                    }
                    coverUrl = await fetchItunesCover(artistName, songName);
                }
            } catch (e) {}

            if (!isPlaying) {
                try {
                    const lfmUrl = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`;
                    const lfmRes = await fetch(lfmUrl);
                    const lfmData = await lfmRes.json();
                    const track = lfmData.recenttracks.track[0];
                    
                    if (track['@attr'] && track['@attr'].nowplaying === 'true') {
                        isPlaying = true; activeSource = 'Navegador';
                        songName = track.name; artistName = track.artist['#text'];
                        albumName = track.album && track.album['#text'] ? `<div class="album">${track.album['#text']}</div>` : '';
                        
                        coverUrl = track.image?.[3]?.[`#text`] || '';
                        if (coverUrl.startsWith('http://')) coverUrl = coverUrl.replace('http://', 'https://');

                        if (!coverUrl || coverUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
                            coverUrl = await fetchItunesCover(artistName, songName);
                        }
                    }
                } catch (error) { }
            }

            const widget = document.getElementById('music-widget');
            const bgLayer = document.getElementById('bg-layer');

            if (isPlaying) {
                const trackIdentifier = `${activeSource}-${songName}-${artistName}`;

                if (currentTrackUrl !== trackIdentifier || currentStatus !== 'playing') {
                    currentTrackUrl = trackIdentifier;
                    currentStatus = 'playing';
                    
                    stopNewsCycle(); fetchNews(); widget.style.opacity = 1; 

                    let innerVisual = '';
                    let weatherHTML = '';

                    if (goianiaWeather) {
                        const wIcon = getWeatherIcon(goianiaWeather.weathercode);
                        const wTemp = Math.round(goianiaWeather.temperature);
                        weatherHTML = `
                            <div class="weather-overlay">
                                ${wTemp}°C ${wIcon}
                            </div>
                        `;
                    }

                    if (coverUrl !== '') {
                        bgLayer.className = ''; 
                        bgLayer.style.backgroundImage = `url('${coverUrl}')`;
                        innerVisual = `<img class="cover-circle" src="${coverUrl}" alt="Capa">`;
                    } else {
                        bgLayer.style.backgroundImage = 'none';
                        bgLayer.className = getBackgroundClass(); 
                        innerVisual = fallbackHTML;
                    }

                    let initialCpuIcon = getStatusIcon(cpuTemp);
                    let initialGpuIcon = getStatusIcon(gpuTemp);

                    let cpuColor = getBarColor(cpuTemp);
                    let gpuColor = getBarColor(gpuTemp);
                    let cpuLoadColor = getLoadColor(cpuLoad);
                    let gpuLoadColor = getLoadColor(gpuLoad);

                    let initCpuHeight = cpuTemp !== '--' ? Math.min(Math.max(cpuTemp, 0), 100) + '%' : '0%';
                    let initGpuHeight = gpuTemp !== '--' ? Math.min(Math.max(gpuTemp, 0), 100) + '%' : '0%';
                    let initCpuLoadHeight = cpuLoad !== '--' ? Math.min(Math.max(cpuLoad, 0), 100) + '%' : '0%';
                    let initGpuLoadHeight = gpuLoad !== '--' ? Math.min(Math.max(gpuLoad, 0), 100) + '%' : '0%';

                    let dashboardHTML = `
                        <div class="dashboard-container">
                            <div class="hw-side-panel">
                                <div class="hw-big-icon" id="cpu-icon">${initialCpuIcon}</div>
                                <div class="hw-bars-row">
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="cpu-bar-fill" style="height: ${initCpuHeight}; background: ${cpuColor}; box-shadow: 0 0 10px ${cpuColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="cpu-t">${cpuTemp}</span><span class="hw-bar-unit">°</span></div>
                                    </div>
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="cpu-load-fill" style="height: ${initCpuLoadHeight}; background: ${cpuLoadColor}; box-shadow: 0 0 10px ${cpuLoadColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="cpu-l">${cpuLoad}</span><span class="hw-bar-unit">%</span></div>
                                    </div>
                                </div>
                                <div class="hw-bar-label">CPU</div>
                            </div>
                            
                            <div class="cover-wrapper">
                                ${innerVisual}
                            </div>
                            
                            <div class="hw-side-panel">
                                <div class="hw-big-icon" id="gpu-icon">${initialGpuIcon}</div>
                                <div class="hw-bars-row">
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="gpu-bar-fill" style="height: ${initGpuHeight}; background: ${gpuColor}; box-shadow: 0 0 10px ${gpuColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="gpu-t">${gpuTemp}</span><span class="hw-bar-unit">°</span></div>
                                    </div>
                                    <div class="hw-bar-col">
                                        <div class="hw-bar-track">
                                            <div class="hw-bar-fill" id="gpu-load-fill" style="height: ${initGpuLoadHeight}; background: ${gpuLoadColor}; box-shadow: 0 0 10px ${gpuLoadColor};"></div>
                                        </div>
                                        <div class="hw-bar-value"><span id="gpu-l">${gpuLoad}</span><span class="hw-bar-unit">%</span></div>
                                    </div>
                                </div>
                                <div class="hw-bar-label">GPU</div>
                            </div>
                        </div>
                    `;

                    widget.innerHTML = `
                        ${weatherHTML}
                        ${dashboardHTML}
                        <div class="title">${songName}</div>
                        <div class="artist">${artistName}</div>
                        ${albumName}
                        <div class="source-badge">Via ${activeSource}</div>
                    `;
                }
            } else {
                if (currentStatus !== 'paused') {
                    currentStatus = 'paused';
                    currentTrackUrl = '';
                    startNewsCycle(); 
                }
            }
        }

        getNowPlaying();
        setInterval(getNowPlaying, 5000); 
    </script>
</body>
</html>
