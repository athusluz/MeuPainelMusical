<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocando Agora - Kraken V6 (Apenas Música/Sensores)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: background-image 0.5s ease-in-out;
        }

        /* Fundos estáticos para performance máxima */
        .aurora-bg { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); }
        .dark-bg { background-color: #050505; background-image: none; }

        #glass-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); 
            z-index: 2;
            transition: background 1s ease;
        }

        #glass-overlay.fire-tint { background: rgba(180, 20, 50, 0.4) !important; }
        #glass-overlay.ice-tint { background: rgba(0, 100, 150, 0.4) !important; }

        #music-widget { 
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
        }

        .dashboard-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            width: 100%;
            margin-bottom: 25px;
        }

        .hw-side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 5;
            width: 110px;
        }

        .hw-big-icon {
            font-size: 42px; 
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .hw-bar-value {
            font-size: 24px; 
            font-weight: 800;
            color: #fff;
            font-variant-numeric: tabular-nums; 
            display: flex;
            align-items: baseline;
            justify-content: center;
        }
        
        .hw-bar-unit { font-size: 14px; font-weight: 600; color: #ddd; margin-left: 2px; }

        .hw-bar-label {
            font-size: 20px; 
            font-weight: 900;
            color: #c2e9fb;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-top: 5px;
        }

        .cover-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5; 
            position: relative;
            width: 340px;
            height: 340px;
            justify-content: center;
        }

        #center-visual-container {
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cover-circle { 
            width: 256px; 
            height: 256px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.8); 
            object-fit: cover;
            display: block;
        }

        .bars-container {
            width: 256px;
            height: 256px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Configuração base da barra (recolhida) */
        .bar {
            width: 12px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            transform-origin: center;
            transform: scaleY(0.1); /* Deixa a barra como um pontinho em repouso */
            transition: transform 0.5s ease;
        }

        /* Configuração de animação ativa (quando há música sem capa) */
        .bar.animated { animation: bounce-opt 1s ease-in-out infinite alternate; }

        .bar.animated:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .bar.animated:nth-child(2) { animation-duration: 0.8s; animation-delay: 0.4s; }
        .bar.animated:nth-child(3) { animation-duration: 0.5s; animation-delay: 0.2s; }
        .bar.animated:nth-child(4) { animation-duration: 0.7s; animation-delay: 0.5s; }
        .bar.animated:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.3s; }

        /* Animação via transform para zerar o reflow da CPU */
        @keyframes bounce-opt {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1.2); }
        }

        .title { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
            letter-spacing: 1px;
            padding: 0 15px;
        }

        .artist { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }

        .album {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="aurora-bg"></div>
    <div id="glass-overlay"></div>

    <div id="music-widget">
        <div class="dashboard-container">
            <div class="hw-side-panel">
                <div class="hw-big-icon" id="cpu-icon">⚡</div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <div class="hw-bar-value"><span id="cpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                    <div class="hw-bar-value" style="font-size: 18px; color: #ccc;"><span id="cpu-l">--</span><span class="hw-bar-unit">%</span></div>
                </div>
                <div class="hw-bar-label">CPU</div>
            </div>
            
            <div class="cover-wrapper">
                <svg width="340" height="340" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none;">
                    <path d="M 170,332 A 162,162 0 0,1 170,8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                    <path d="M 170,318 A 148,148 0 0,1 170,22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 170,332 A 162,162 0 0,0 170,8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                    <path d="M 170,318 A 148,148 0 0,0 170,22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
                    
                    <g id="music-ring-container" style="display: none;">
                        <path d="M 170,306 A 136,136 0 0,1 170,34" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 170,306 A 136,136 0 0,0 170,34" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-linecap="round"/>
                        <path id="music-progress-left" d="M 170,306 A 136,136 0 0,1 170,34" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="427" stroke-dashoffset="427" stroke-linecap="round"/>
                        <path id="music-progress-right" d="M 170,306 A 136,136 0 0,0 170,34" fill="none" stroke="#ff9a9e" stroke-width="4" stroke-dasharray="427" stroke-dashoffset="427" stroke-linecap="round"/>
                    </g>

                    <path id="cpu-bar-fill" d="M 170,332 A 162,162 0 0,1 170,8" fill="none" stroke="transparent" stroke-width="8" stroke-linecap="round" stroke-dasharray="509" stroke-dashoffset="509"/>
                    <path id="cpu-load-fill" d="M 170,318 A 148,148 0 0,1 170,22" fill="none" stroke="transparent" stroke-width="6" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465"/>
                    <path id="gpu-bar-fill" d="M 170,332 A 162,162 0 0,0 170,8" fill="none" stroke="transparent" stroke-width="8" stroke-linecap="round" stroke-dasharray="509" stroke-dashoffset="509"/>
                    <path id="gpu-load-fill" d="M 170,318 A 148,148 0 0,0 170,22" fill="none" stroke="transparent" stroke-width="6" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465"/>
                </svg>

                <div id="center-visual-container">
                    </div>
            </div>
            
            <div class="hw-side-panel">
                <div class="hw-big-icon" id="gpu-icon">⚡</div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <div class="hw-bar-value"><span id="gpu-t">--</span><span class="hw-bar-unit">°C</span></div>
                    <div class="hw-bar-value" style="font-size: 18px; color: #ccc;"><span id="gpu-l">--</span><span class="hw-bar-unit">%</span></div>
                </div>
                <div class="hw-bar-label">GPU</div>
            </div>
        </div>

        <div id="info-title" class="title">Inicializando...</div>
        <div id="info-artist" class="artist"></div>
        <div id="info-album" class="album"></div>
    </div>

    <script>
        const USERNAME = 'athusluz'; 
        const API_KEY = 'fc951f4fa2b53280f062eb4d47e7810b'; 

        let currentTrackUrl = ''; let currentStatus = ''; 
        let cpuTemp = '--'; let cpuLoad = '--'; let gpuTemp = '--'; let gpuLoad = '--';

        const elBgLayer = document.getElementById('bg-layer');
        const elCenterVisual = document.getElementById('center-visual-container');
        const elTitle = document.getElementById('info-title');
        const elArtist = document.getElementById('info-artist');
        const elAlbum = document.getElementById('info-album');
        const elGlass = document.getElementById('glass-overlay');

        // HTML base para os dois cenários visuais de fallback
        const fallbackBarsAnimatedHTML = `<div class="bars-container"><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div><div class="bar animated"></div></div>`;
        const fallbackBarsFlatHTML = `<div class="bars-container"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;

        let pTracker = { active: false, posSec: 0, durSec: 0 };
        let wnpConnected = false;
        let wnpState = { state: 0, title: '', artist: '', album: '', coverUrl: '', positionSec: 0, durationSec: 0 };
        
        function connectWNP() {
            let ws = new WebSocket('ws://127.0.0.1:8999');
            ws.onopen = () => wnpConnected = true;
            ws.onclose = () => { wnpConnected = false; setTimeout(connectWNP, 10000); };
            ws.onmessage = (e) => {
                const d = e.data;
                if (d.startsWith('STATE:')) wnpState.state = parseInt(d.substring(6));
                else if (d.startsWith('TITLE:')) wnpState.title = d.substring(6);
                else if (d.startsWith('ARTIST:')) wnpState.artist = d.substring(7);
                else if (d.startsWith('ALBUM:')) wnpState.album = d.substring(6);
                else if (d.startsWith('COVER:')) wnpState.coverUrl = d.substring(6);
                else if (d.startsWith('POSITION:')) {
                    let p = d.substring(9).split(':'); wnpState.positionSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
                else if (d.startsWith('DURATION:')) {
                    let p = d.substring(9).split(':'); wnpState.durationSec = p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(p[0])*3600 + parseInt(p[1])*60 + parseInt(p[2]);
                }
            };
        }
        connectWNP();

        function getBarColor(temp) {
            if (temp === '--') return 'transparent';
            if (temp <= 40) return '#00d2ff'; if (temp <= 65) return '#a8e063'; 
            if (temp <= 75) return '#f6d365'; return '#ff416c'; 
        }

        // Função dos Ícones baseados na Temperatura
        function getStatusIcon(temp) {
            if (temp === '--') return '⚡';
            if (temp <= 30) return '🧊';
            if (temp <= 40) return '❄️';
            if (temp <= 50) return '⚡';
            if (temp <= 60) return '🔥';
            return '🌋';
        }

        window.nzxt = {
            v1: {
                onMonitoringDataUpdate: (data) => {
                    const { cpus, gpus } = data;
                    if (cpus?.length > 0) { cpuTemp = Math.round(cpus[0].temperature); cpuLoad = Math.round(cpus[0].load <= 1 ? cpus[0].load * 100 : cpus[0].load); }
                    if (gpus?.length > 0) { gpuTemp = Math.round(gpus[0].temperature); gpuLoad = Math.round(gpus[0].load <= 1 ? gpus[0].load * 100 : gpus[0].load); }
                    
                    let mx = Math.max(cpuTemp !== '--' ? cpuTemp : 0, gpuTemp !== '--' ? gpuTemp : 0);
                    if (mx > 55) elGlass.className = 'fire-tint'; else if (mx < 40 && mx > 0) elGlass.className = 'ice-tint'; else elGlass.className = '';

                    // Atualizando Textos
                    document.getElementById('cpu-t').innerText = cpuTemp; 
                    document.getElementById('cpu-l').innerText = cpuLoad;
                    document.getElementById('gpu-t').innerText = gpuTemp; 
                    document.getElementById('gpu-l').innerText = gpuLoad;

                    // Atualizando Ícones Dinâmicos
                    document.getElementById('cpu-icon').innerText = getStatusIcon(cpuTemp);
                    document.getElementById('gpu-icon').innerText = getStatusIcon(gpuTemp);

                    // Atualizando Barras SVG
                    if (cpuTemp !== '--') { document.getElementById('cpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(cpuTemp, 100) / 100); document.getElementById('cpu-bar-fill').style.stroke = getBarColor(cpuTemp); }
                    if (cpuLoad !== '--') { document.getElementById('cpu-load-fill').style.strokeDashoffset = 465 - (465 * Math.min(cpuLoad, 100) / 100); document.getElementById('cpu-load-fill').style.stroke = getBarColor(cpuLoad); }
                    if (gpuTemp !== '--') { document.getElementById('gpu-bar-fill').style.strokeDashoffset = 509 - (509 * Math.min(gpuTemp, 100) / 100); document.getElementById('gpu-bar-fill').style.stroke = getBarColor(gpuTemp); }
                    if (gpuLoad !== '--') { document.getElementById('gpu-load-fill').style.strokeDashoffset = 465 - (465 * Math.min(gpuLoad, 100) / 100); document.getElementById('gpu-load-fill').style.stroke = getBarColor(gpuLoad); }
                }
            }
        };

        // Agora recebe a flag "isPlaying" para determinar a injeção do HTML animado vs plano
        function updateUI(bg, t, a, al, isPlaying) {
            if (bg) { 
                elBgLayer.className = ''; elBgLayer.style.backgroundImage = `url('${bg}')`; 
                elCenterVisual.innerHTML = `<img class="cover-circle" src="${bg}">`; 
            } else { 
                elBgLayer.style.backgroundImage = 'none'; 
                elBgLayer.className = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? 'dark-bg' : 'aurora-bg'; 
                elCenterVisual.innerHTML = isPlaying ? fallbackBarsAnimatedHTML : fallbackBarsFlatHTML; 
            }
            
            elTitle.innerText = t; 
            elArtist.innerText = a;
            if(al) { elAlbum.style.display = 'block'; elAlbum.innerText = al; } else { elAlbum.style.display = 'none'; }
        }

        // Loop separado só para a barra de progresso (reduzindo complexidade em NowPlaying)
        setInterval(() => {
            const c = document.getElementById('music-ring-container');
            if (pTracker.active && pTracker.durSec > 0) {
                c.style.display = 'block'; pTracker.posSec = Math.min(pTracker.posSec + 1, pTracker.durSec);
                let o = 427 - (427 * (pTracker.posSec / pTracker.durSec));
                document.getElementById('music-progress-left').style.strokeDashoffset = o; document.getElementById('music-progress-right').style.strokeDashoffset = o;
            } else { c.style.display = 'none'; }
        }, 1000);

        async function getNowPlaying() {
            let isP = false; let sn = ''; let an = ''; let al = ''; let dc = ''; let hasP = false; let tp = 0; let td = 0;
            if (wnpConnected && wnpState.state === 1) { isP = true; sn = wnpState.title; an = wnpState.artist; al = wnpState.album; dc = wnpState.coverUrl; if (wnpState.durationSec > 0) { hasP = true; tp = wnpState.positionSec; td = wnpState.durationSec; } }
            if (!isP) {
                try {
                    const lfm = await (await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`)).json();
                    const tr = lfm.recenttracks.track[0];
                    if (tr['@attr']?.nowplaying === 'true') { isP = true; sn = tr.name; an = tr.artist['#text']; al = tr.album?.['#text']; dc = tr.image?.[3]?.[`#text`]?.replace('http://', 'https://') || ''; }
                } catch (e) { }
            }
            pTracker.active = hasP; pTracker.posSec = tp; pTracker.durSec = td;
            
            if (isP) {
                const tId = `${sn}-${an}`;
                if (currentTrackUrl !== tId || currentStatus !== 'playing') {
                    currentTrackUrl = tId; currentStatus = 'playing';
                    const clean = encodeURIComponent((sn || '').replace(/\(.*?\)/g, '').replace(/[-_]/g, ' ').trim());
                    let cv = dc; 
                    if(!cv) { try { cv = (await (await fetch(`https://itunes.apple.com/search?term=${clean}&media=music&entity=song&limit=1`)).json()).results[0]?.artworkUrl100.replace('100x100bb', '600x600bb') || ''; } catch(e){} }
                    
                    const img = new Image(); 
                    img.onload = () => updateUI(cv, sn, an, al, true); 
                    img.onerror = () => updateUI('', sn, an, al, true); 
                    img.src = cv || 'empty';
                }
            } else { 
                if (currentStatus !== 'paused') { 
                    currentStatus = 'paused'; currentTrackUrl = ''; pTracker.active = false; 
                    updateUI('', 'O silêncio..', '', '', false);
                } 
            }
        }
        
        getNowPlaying(); setInterval(getNowPlaying, 5000); 
    </script>
</body>
</html>
